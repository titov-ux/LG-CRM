# Локальное окружение для разработки backend.
# Поднимает Postgres 16 + Redis 7.
# Бэк в этом compose НЕ запускается — он крутится локально через `make dev`
# (для скорости горячей перезагрузки и удобного debug).
#
# Запуск:
#   docker compose -f infra/docker-compose.dev.yml up -d
# Остановка:
#   docker compose -f infra/docker-compose.dev.yml down
# Полный сброс данных:
#   docker compose -f infra/docker-compose.dev.yml down -v
#
# Celery здесь СОЗНАТЕЛЬНО нет (в отличие от prod-компоуза с профилем `celery`):
# в dev SCREENING_ANALYSIS_EAGER=true, и пост-анализ скрининга выполняется
# прямо в процессе бэка после finish. Побочный эффект: beat-задач тоже нет —
# retention аудио (`screening.purge_expired_audio`) и уборщик залипших
# live/processing-сессий (`screening.close_stale_sessions`) локально не
# работают; проверять их надо на staging либо запускать worker+beat руками
# (`celery -A app.celery_app worker` / `beat` рядом с `make dev`).

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-lg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_lg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_lg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crm-lg-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # stt-service — распознавание речи для AI-скрининга (Этап 2).
  # Опционален: без него WS /ws/screening работает (комната, запись, чек-лист),
  # но живого транскрипта нет — бэк отдаёт sttReady:false.
  # Первый билд прогревает модель small (~500МБ с HuggingFace) в образ.
  # Быстрый старт без модели: STT_FAKE=1 (заглушка, для отладки пайплайна);
  # по умолчанию тут STT_FAKE=0, то есть поднимается настоящая модель.
  #   STT_FAKE=1 docker compose -f infra/docker-compose.dev.yml --profile stt up -d
  stt:
    build:
      context: ../services/stt
    container_name: crm-lg-stt
    restart: unless-stopped
    profiles: ["stt"]
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-4}
      STT_MAX_SESSIONS: ${STT_MAX_SESSIONS:-8}
      STT_FAKE: ${STT_FAKE:-0}
    ports:
      - "8765:8765"

volumes:
  postgres_data:
  redis_data:
