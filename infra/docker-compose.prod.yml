# Production-стек для Yandex Cloud VM.
# Поднимает: postgres + redis + backend (uvicorn) + celery worker + celery beat + nginx.
#
# Перед запуском:
#   1. cp .env.prod.example .env.prod и заполнить (БД-пароль, JWT_SECRET, S3-ключи, SENTRY_DSN).
#   2. cp infra/nginx.example.conf infra/nginx.conf и обновить server_name + сертификаты.
#   3. Положить TLS-сертификаты в infra/certs/ (fullchain.pem, privkey.pem).
#   4. Сбилдить фронт: cd frontend && pnpm build → frontend/dist (его монтируем в nginx).
#   5. docker compose -f infra/docker-compose.prod.yml --env-file .env.prod \
#        --profile celery up -d
#
# ВАЖНО: флаг `--profile celery` в деплое ОБЯЗАТЕЛЕН (и в up, и в ps/logs/down).
# Без него celery-worker и celery-beat не поднимаются, а значит:
#   * при SCREENING_ANALYSIS_EAGER=false отчёты скрининга навсегда зависают
#     в статусе `processing` (задача `screening.analyze_session` никем не берётся);
#   * не выполняется retention аудио (beat `screening.purge_expired_audio`) —
#     записи копятся в S3 дольше SCREENING_AUDIO_RETENTION_DAYS (риск по 152-ФЗ);
#   * не работает уборщик сессий (beat `screening.close_stale_sessions`, раз в
#     минуту): live-сессия с оборванным WS висит вечно вместо закрытия по
#     SCREENING_ORPHAN_GRACE_MIN, hard-stop по SCREENING_MAX_DURATION_MIN не
#     срабатывает, если WS уже мёртв, и не отрабатывает автоперепостановка
#     залипшего пост-анализа (SCREENING_PROCESSING_TIMEOUT_MIN).
#     Ручные обходы — docs/runbook.md §8 (в т.ч. §8.2 про processing).
#
# Миграции: docker compose ... exec backend alembic upgrade head
# Seed admin/permissions: docker compose ... exec backend make seed

x-backend-base: &backend-base
  build:
    context: ../backend
    dockerfile: Dockerfile
  env_file: ../.env.prod
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-lg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set me in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-crm_lg}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crm-lg-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend-base
    container_name: crm-lg-backend
    # --ws-max-size 4194304 — лимит размера WS-фрейма 4 МБ (дефолт uvicorn 16 МБ);
    # ровно этот лимит задокументирован в infra/nginx.example.conf.
    #
    # --workers 1 — НЕ опечатка и не «временно», менять нельзя без работы ниже.
    # Комната скрининга держит два реестра ПРОЦЕССА, а не общего хранилища
    # (backend/app/api/v1/endpoints/screening_ws.py):
    #   * _ACTIVE_SOCKETS  — одно активное WS-соединение на session_id: новое
    #     подключение вытесняет предыдущее;
    #   * _LINGERING_BRIDGES — «припаркованный» STT-мост, который переживает
    #     обрыв клиента SCREENING_WS_HOLD_SEC и переиспользуется на reconnect.
    # При >1 воркере оба реестра расщепляются: reconnect почти всегда попадает
    # в ДРУГОЙ воркер, и тогда
    #   * вытеснение не срабатывает — на одну сессию оказывается два писателя
    #     сегментов (UNIQUE по seq не спасает: seq у них разные, в транскрипт
    #     приезжают дубли реплик);
    #   * припаркованный мост не находится — контекст распознавания теряется,
    #     на каждый reconnect поднимается новая сессия в stt-service и быстрее
    #     упирается STT_MAX_SESSIONS (WS close 1013 / error:busy).
    # Плюс /metrics: in-process счётчики скрининга при нескольких воркерах
    # показывали срез случайного воркера — с одним воркером scrape честный
    # (см. infra/alerts/screening.rules.yml).
    #
    # ЦЕНА: весь REST обслуживает один процесс — потолок по CPU-bound запросам
    # примерно вдвое ниже прежнего. Для текущей 2-vCPU VM это приемлемо (профиль
    # нагрузки — I/O-bound: Postgres, S3, внешние API), но заметно на тяжёлых
    # выгрузках/отчётах. Если упрёмся — сначала вертикальное масштабирование VM.
    #
    # Вернуть 2+ воркера можно ТОЛЬКО после одного из двух:
    #   1) вынести оба реестра во внешнее состояние — Redis (владелец сокета по
    #      ключу session_id + сигнал вытеснения через pub/sub; мост при этом
    #      всё равно живёт в памяти конкретного воркера, значит его парковка
    #      теряет смысл, либо STT-мост выносится в отдельный процесс);
    #   2) липкая маршрутизация: nginx/upstream hash по session_id из пути WS,
    #      чтобы все подключения одной сессии попадали в один и тот же воркер
    #      (требует отдельных upstream-ов на воркер, т.е. по процессу на порт).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips=*", "--ws-max-size", "4194304"]
    expose:
      - "8000"

  celery-worker:
    <<: *backend-base
    container_name: crm-lg-celery-worker
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    # app.celery_app существует; сервис обязателен на проде — он выполняет
    # пост-анализ скрининга (`screening.analyze_session`). Профиль оставлен,
    # чтобы можно было поднять стек без Celery локально; в деплое всегда
    # добавляем `--profile celery` (см. шапку файла).
    profiles: ["celery"]

  celery-beat:
    <<: *backend-base
    container_name: crm-lg-celery-beat
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    profiles: ["celery"]

  # AI-скрининг STT (Этап 2/6). CPU/small на этой VM; GPU — tofu create_stt_vm.
  # Реальная модель: build --build-arg STT_FULL=1 и STT_FAKE=0.
  # Параллельные встречи: STT_MAX_SESSIONS (CPU≈2–3, T4≈5–8).
  stt:
    build:
      context: ../services/stt
      dockerfile: Dockerfile
      args:
        STT_FULL: "${STT_FULL:-0}"
    container_name: crm-lg-stt
    restart: unless-stopped
    environment:
      # Дефолт 0: с STT_FAKE=1 в БД пишутся заглушечные расшифровки «[fake N.Ns]».
      STT_FAKE: "${STT_FAKE:-0}"
      STT_MODEL: "${STT_MODEL:-small}"
      STT_DEVICE: "${STT_DEVICE:-cpu}"
      STT_COMPUTE_TYPE: "${STT_COMPUTE_TYPE:-int8}"
      STT_CPU_THREADS: "${STT_CPU_THREADS:-4}"
      STT_MAX_SESSIONS: "${STT_MAX_SESSIONS:-8}"
      STT_PORT: "8765"
      # Кеш весов HuggingFace/faster-whisper внутри именованного тома —
      # иначе модель (small ≈500МБ, large-v3 ≈3ГБ) качается заново
      # при каждом пересоздании контейнера.
      HF_HOME: "/root/.cache/huggingface"
    volumes:
      - stt_models:/root/.cache/huggingface
    # Ресурсные лимиты (compose v2, не swarm): на VM всего 2 vCPU и 4 ГБ,
    # без потолка whisper выедает CPU/RAM и роняет backend с postgres.
    # Под GPU/большую модель поднимать через .env.prod, а не правкой файла.
    mem_limit: "${STT_MEM_LIMIT:-1500m}"
    cpus: "${STT_CPUS:-1.0}"
    expose:
      - "8765"

  nginx:
    image: nginx:1.27-alpine
    container_name: crm-lg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # /etc/letsencrypt смонтирован read-only, чтобы симлинки в ./certs
      # (которые ссылаются на /etc/letsencrypt/live/<domain>/...) разрешались
      # внутри контейнера. После certbot renew nginx сразу видит новый сертификат.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      # ACME-challenge для certbot renew (webroot-mode).
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  # Кеш моделей faster-whisper/HuggingFace для сервиса stt.
  stt_models:
