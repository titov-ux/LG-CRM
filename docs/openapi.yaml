openapi: 3.1.0
info:
  title: CRM ЛГ Интеграция API
  version: 0.1.0
  description: |
    Контракт REST API CRM-системы «ЛГ Интеграция».

    Источник истины формируется в две стороны: код фронта (`frontend/src/api/*.ts`
    и `frontend/src/mocks/handlers.ts`) → OpenAPI → код бэкенда (FastAPI).

    Все мутирующие эндпоинты возвращают актуальное состояние ресурса (либо
    `{ ok: true }` для удалений). Чувствительные поля кандидатов (`email`,
    `phone`, `rateMonth`) фильтруются на сервере в зависимости от роли —
    клиент получит `null` или `"—"` вместо значения.
  contact:
    name: ЛГ Интеграция
    email: ops@lg.ru

servers:
  - url: /api/v1
    description: Боевой API (через nginx reverse proxy)
  - url: http://localhost:8000/api/v1
    description: Локальная разработка

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: clients
  - name: contacts
  - name: vacancies
  - name: candidates
  - name: matching
  - name: comments
  - name: chat
    description: |
      Внутренний чат сотрудников: DM (личные) и группы. Сообщения, история,
      keyset-пагинация. Этап 1 MVP без реакций, тредов, поиска.
  - name: notifications
  - name: audit
  - name: analytics
  - name: permissions
  - name: files
  - name: screenings
    description: |
      AI-скрининг: видеоинтервью в Яндекс Телемосте с записью звука,
      чек-листом вопросов и (этапы 2–5) live-транскриптом и AI-отчётом.
      Захват звука — на стороне рекрутера (вкладка Телемоста + микрофон).
  - name: documents
    description: |
      База знаний и хранилище документов команды: разделы (клиенты, регламенты, компания,
      сотрудники, исполнители, тендеры, общее), папки, теги, версии, комментарии,
      избранное. Контент файлов хранится в `/files` (S3-presign), `Document.fileId`
      ссылается на загруженный файл.

paths:
  # ─────────────── AUTH ───────────────
  /auth/login:
    post:
      tags: [auth]
      summary: Войти по email/паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успешный вход. Refresh-токен ставится в httpOnly cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Неверный email/пароль (code=invalid_credentials)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: |
            Аккаунт временно заблокирован после неудачных попыток (code=account_locked)
            или деактивирован (code=user_inactive)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновить access-токен по refresh-cookie
      security: []
      responses:
        '200':
          description: Новый access-токен.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Выйти (отозвать refresh-токен)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/me:
    get:
      tags: [auth]
      summary: Профиль текущего пользователя
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/password:
    post:
      tags: [auth]
      summary: Сменить пароль текущего пользователя
      description: |
        Проверяет текущий пароль и устанавливает новый. Остальные сессии
        пользователя разлогиниваются (refresh-токены отзываются), текущая
        сессия остаётся активной — сервер ставит свежий refresh в cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400':
          description: Неверный текущий пароль или пароль не изменился
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────── USERS ───────────────
  /users:
    get:
      tags: [users]
      summary: Список пользователей
      responses:
        '200':
          description: Все пользователи (без пагинации — справочник)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [users]
      summary: Создать пользователя
      description: |
        Если `password` не передан — пользователь создаётся с `isActive=false`,
        ему уходит письмо со ссылкой на установку пароля. В этом случае при
        отсутствии настроенного SMTP в ответе будет `inviteUrl`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUserResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email уже существует
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    patch:
      tags: [users]
      summary: Обновить пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [users]
      summary: Удалить пользователя (мягкое удаление)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/invite:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [users]
      summary: Переотправить invite-приглашение
      description: |
        Генерирует новый invite-токен и шлёт письмо повторно. Допустимо только
        для пользователей с `isActive=false`. Возвращает обновлённый ответ
        с флагом `emailSent` и при необходимости `inviteUrl` (если SMTP не
        настроен или письмо не ушло).
      responses:
        '200':
          description: Invite issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteResendResponse' }
        '400':
          description: Пользователь уже активирован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [users]
      summary: Сбросить пароль пользователя (админ)
      description: |
        Задаёт пользователю новый пароль без знания текущего. Все его активные
        сессии разлогиниваются (refresh-токены отзываются). Свой пароль так
        менять нельзя — 400 `use_profile_endpoint`, для себя используется
        `POST /auth/me/password` с подтверждением текущего пароля.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400':
          description: Попытка сменить пароль самому себе (code=use_profile_endpoint)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────── INVITE (публичные) ───────────────
  /auth/invite/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    get:
      tags: [auth]
      summary: Информация по invite-токену
      description: Возвращает email/имя для подсветки формы установки пароля.
      responses:
        '200':
          description: InviteInfo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteInfo' }
        '404':
          description: Токен не найден
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '410':
          description: Токен истёк или уже использован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/invite/{token}/activate:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    post:
      tags: [auth]
      summary: Активировать аккаунт и установить пароль
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateInviteRequest' }
      responses:
        '200':
          description: Аккаунт активирован, выданы токены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '404':
          description: Токен не найден
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '410':
          description: Токен истёк или уже использован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────── CLIENTS ───────────────
  /clients:
    get:
      tags: [clients]
      summary: Список клиентов
      parameters:
        - { in: query, name: search,           schema: { type: string } }
        - { in: query, name: status,           schema: { $ref: '#/components/schemas/ClientStatus' } }
        - { in: query, name: accountManagerId, schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: industry,         schema: { type: string } }
        - { in: query, name: clientKind,       schema: { $ref: '#/components/schemas/ClientKind' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница клиентов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPage' }
    post:
      tags: [clients]
      summary: Создать клиента
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClientRequest' }
      responses:
        '201':
          description: Client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
  /clients/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [clients]
      summary: Клиент по id
      responses:
        '200':
          description: Client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [clients]
      summary: Обновить клиента
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClientRequest' }
      responses:
        '200':
          description: Client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [clients]
      summary: Удалить клиента (soft-delete)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clients/{id}/contacts:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [clients, contacts]
      summary: Контакты клиента
      responses:
        '200':
          description: Контакты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
    post:
      tags: [clients, contacts]
      summary: Добавить контакт клиенту
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
      responses:
        '201':
          description: Contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────── CONTACTS (плоский список) ───────────────
  /contacts:
    get:
      tags: [contacts]
      summary: Список контактов всех клиентов
      parameters:
        - { in: query, name: search,      schema: { type: string } }
        - { in: query, name: clientId,    schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: hasEmail,    schema: { type: boolean } }
        - { in: query, name: hasPhone,    schema: { type: boolean } }
        - { in: query, name: hasTelegram, schema: { type: boolean } }
        - { in: query, name: hasBirthday, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница контактов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactListItemPage' }
  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [contacts]
      summary: Контакт по id (с названием клиента)
      responses:
        '200':
          description: ContactListItem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactListItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [contacts]
      summary: Обновить контакт
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
      responses:
        '200':
          description: ContactListItem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactListItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [contacts]
      summary: Удалить контакт
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────── VACANCIES ───────────────
  /vacancies:
    get:
      tags: [vacancies]
      summary: Список вакансий с фильтрами
      parameters:
        - { in: query, name: search,           schema: { type: string } }
        - { in: query, name: status,           schema: { $ref: '#/components/schemas/VacancyStatus' } }
        - { in: query, name: clientId,         schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: grade,            schema: { $ref: '#/components/schemas/Grade' } }
        - { in: query, name: priority,         schema: { $ref: '#/components/schemas/Priority' } }
        - { in: query, name: recruiterId,      schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: accountManagerId, schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: engagementType,   schema: { $ref: '#/components/schemas/EngagementType' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница вакансий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyPage' }
    post:
      tags: [vacancies]
      summary: Создать вакансию
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVacancyRequest' }
      responses:
        '201':
          description: Vacancy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
  /vacancies/kanban-order:
    put:
      tags: [vacancies]
      summary: Пакетное обновление порядка карточек на канбане
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [id, status, kanbanOrder]
                    properties:
                      id:          { $ref: '#/components/schemas/UUID' }
                      status:      { $ref: '#/components/schemas/VacancyStatus' }
                      kanbanOrder: { type: integer }
      responses:
        '200':
          description: Обновлённые вакансии
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vacancy' }
  /vacancies/transitions:
    get:
      tags: [vacancies]
      summary: Карта разрешённых переходов между статусами вакансии
      description: |
        Возвращает словарь `transitions` { fromStatus: [allowedTo...] } и
        список финальных статусов (для них смена статуса требует комментария).
      responses:
        '200':
          description: Transitions config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionsResponse' }
  /vacancies/parse-text:
    post:
      tags: [vacancies]
      summary: AI-распознавание сплошного текста брифа в структурированные поля
      description: |
        Использует LLM (Anthropic Claude). Возвращает `ParsedVacancy` —
        частично заполненный объект, фронт применяет его поверх формы.
        Если AI недоступен (нет ключа/сетевая ошибка), эндпоинт возвращает
        503 `ai_unavailable`; фронт показывает соответствующее сообщение.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 50000
      responses:
        '200':
          description: Распознанные поля вакансии
          content:
            application/json:
              schema:
                type: object
                required: [parsed]
                properties:
                  parsed: { $ref: '#/components/schemas/ParsedVacancy' }
        '502':
          description: AI вернул ошибку формата (ai_bad_request)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: AI-сервис недоступен (ai_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /vacancies/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [vacancies]
      summary: Вакансия по id
      responses:
        '200':
          description: Vacancy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [vacancies]
      summary: Обновить вакансию
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVacancyRequest' }
      responses:
        '200':
          description: Vacancy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [vacancies]
      summary: Удалить вакансию (soft-delete)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /vacancies/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    patch:
      tags: [vacancies]
      summary: Сменить статус вакансии (с валидацией перехода и опциональным комментарием)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:  { $ref: '#/components/schemas/VacancyStatus' }
                comment: { type: string }
      responses:
        '200':
          description: Vacancy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Недопустимый переход / отсутствует обязательный комментарий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /vacancies/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [vacancies, audit]
      summary: Активность по вакансии
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityEntry' }
  /vacancies/{id}/candidates:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [vacancies, matching]
      summary: Прикреплённые к вакансии кандидаты
      responses:
        '200':
          description: matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VacancyCandidate' }
    post:
      tags: [vacancies, matching]
      summary: Прикрепить кандидата к вакансии (идемпотентно)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId]
              properties:
                candidateId: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: Match (новый или существующий)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyCandidate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Тип кандидата не совпадает с типом вакансии (engagement_type_mismatch)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────── MATCHES ───────────────
  /matches/{matchId}:
    parameters:
      - in: path
        name: matchId
        required: true
        schema: { type: string }
        description: ID match-связки (UUID или синтетический `m-{vacancyId}-{candidateId}` в MSW)
    patch:
      tags: [matching]
      summary: Сменить статус match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:   { $ref: '#/components/schemas/MatchStatus' }
                feedback: { type: string }
      responses:
        '200':
          description: VacancyCandidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyCandidate' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [matching]
      summary: Открепить кандидата от вакансии
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────── CANDIDATES ───────────────
  /candidates:
    get:
      tags: [candidates]
      summary: Список кандидатов
      parameters:
        - { in: query, name: search,         schema: { type: string } }
        - { in: query, name: status,         schema: { $ref: '#/components/schemas/CandidateStatus' } }
        - { in: query, name: grade,          schema: { $ref: '#/components/schemas/Grade' } }
        - { in: query, name: recruiterId,    schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: stack,          schema: { type: string, description: 'CSV-список технологий' } }
        - { in: query, name: engagementType, schema: { $ref: '#/components/schemas/EngagementType' } }
        - { in: query, name: employmentType, schema: { $ref: '#/components/schemas/EmploymentType' } }
        - in: query
          name: archived
          schema:
            oneOf:
              - { type: boolean }
              - { type: string, enum: [all] }
          description: |
            false (по умолчанию) — только активные на доске; true — только архивные; "all" — оба.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница кандидатов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatePage' }
    post:
      tags: [candidates]
      summary: Создать кандидата
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCandidateRequest' }
      responses:
        '201':
          description: Candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '409':
          description: Дубликат по email/phone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /candidates/kanban-order:
    put:
      tags: [candidates]
      summary: Пакетное обновление порядка карточек кандидатов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [id, status, kanbanOrder]
                    properties:
                      id:          { $ref: '#/components/schemas/UUID' }
                      status:      { $ref: '#/components/schemas/CandidateStatus' }
                      kanbanOrder: { type: integer }
      responses:
        '200':
          description: Обновлённые кандидаты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidate' }
  /candidates/parse-resume-text:
    post:
      tags: [candidates]
      summary: AI-распознавание сплошного текста резюме в поля карточки кандидата
      description: |
        Использует LLM (YandexGPT). Возвращает `ParsedCandidate` —
        частично заполненный объект, фронт применяет его поверх формы.
        Большие резюме (10+ страниц HH) бэкенд парсит по частям несколькими
        параллельными вызовами модели и склеивает результат.
        Если AI недоступен (нет ключа/сетевая ошибка), эндпоинт возвращает
        503 `ai_unavailable`; фронт показывает соответствующее сообщение.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 150000
      responses:
        '200':
          description: Распознанные поля кандидата
          content:
            application/json:
              schema:
                type: object
                required: [parsed]
                properties:
                  parsed: { $ref: '#/components/schemas/ParsedCandidate' }
        '502':
          description: AI вернул ошибку формата (ai_bad_request)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: AI-сервис недоступен (ai_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /candidates/extract-doc:
    post:
      tags: [candidates]
      summary: Извлечение текста из бинарного .doc (Word 97-2003)
      description: |
        Принимает multipart-файл .doc и возвращает plain-текст через
        системный antiword. Нужен только для .doc — .docx/.pdf/.rtf/.txt
        парсятся на клиенте. Размер файла ≤ 10 МБ.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Извлечённый plain-текст
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        '400':
          description: Не .doc файл или пустой upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '413':
          description: Файл больше 10 МБ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Парсер не смог обработать файл (повреждён/защищён)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: antiword не установлен на сервере
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '504':
          description: Парсер не уложился в 30 секунд
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /candidates/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [candidates]
      summary: Кандидат по id
      responses:
        '200':
          description: Candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [candidates]
      summary: Обновить кандидата
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCandidateRequest' }
      responses:
        '200':
          description: Candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [candidates]
      summary: |
        Удалить кандидата. По умолчанию — soft-archive (убирает с канбана,
        оставляет в базе). С `?permanent=true` — полное удаление (admin only).
      parameters:
        - in: query
          name: permanent
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /candidates/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    patch:
      tags: [candidates]
      summary: Сменить статус кандидата
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:  { $ref: '#/components/schemas/CandidateStatus' }
                comment: { type: string }
      responses:
        '200':
          description: Candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Недопустимый переход
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /candidates/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [candidates]
      summary: Убрать кандидата с канбан-доски (в архив)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '404': { $ref: '#/components/responses/NotFound' }
  /candidates/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [candidates]
      summary: Вернуть кандидата на доску
      responses:
        '200':
          description: Candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '404': { $ref: '#/components/responses/NotFound' }
  /candidates/{id}/resume/improve:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [candidates]
      summary: AI-адаптация резюме кандидата под конкретную вакансию
      description: |
        Просит LLM (YandexGPT) переписать сопроводительное, переставить
        навыки/стек и переформулировать буллеты опыта с акцентом на
        технологии и задачи из вакансии. **Не выдумывает фактов**:
        компании/должности/даты остаются как у кандидата; список мест
        работы возвращается той же длины и в том же порядке.

        Фронт мерджит непустые поля поверх Candidate и сразу
        отдаёт пользователю DOCX.

        Если AI недоступен — 503 `ai_unavailable`; если AI вернул мусор —
        502 `ai_bad_request`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vacancyId]
              properties:
                vacancyId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Адаптированное резюме
          content:
            application/json:
              schema:
                type: object
                required: [improvement]
                properties:
                  improvement: { $ref: '#/components/schemas/ImprovedResume' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: AI вернул ошибку формата (ai_bad_request)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: AI-сервис недоступен (ai_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /candidates/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [candidates, audit]
      summary: Активность по кандидату
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityEntry' }

  /clients/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [clients, audit]
      summary: Активность по клиенту
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityEntry' }

  # ─────────────── COMMENTS ───────────────
  /comments:
    get:
      tags: [comments]
      summary: Комментарии к сущности
      parameters:
        - { in: query, name: entityType, required: true, schema: { $ref: '#/components/schemas/CommentEntityType' } }
        - { in: query, name: entityId,   required: true, schema: { $ref: '#/components/schemas/UUID' } }
      responses:
        '200':
          description: Список комментариев (с ответами)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
    post:
      tags: [comments]
      summary: Создать комментарий
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
  /comments/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    patch:
      tags: [comments]
      summary: Редактировать комментарий (автор)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCommentRequest' }
      responses:
        '200':
          description: Comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [comments]
      summary: Удалить комментарий (автор / admin)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────── CHAT ───────────────
  /chat/conversations:
    get:
      tags: [chat]
      summary: Список моих диалогов (DM/group)
      parameters:
        - in: query
          name: includeArchived
          description: Если true — отдаёт также архивированные мной диалоги (myHiddenAt != null).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Сортировка по lastMessageAt DESC NULLS LAST.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatConversation' }
  /chat/conversations/dm:
    post:
      tags: [chat]
      summary: Открыть или создать DM с пользователем (идемпотентно)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDmRequest' }
      responses:
        '201':
          description: ChatConversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '400':
          description: Себе писать нельзя (code=self_dm)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [chat]
      summary: Карточка диалога (только для участников)
      responses:
        '200':
          description: ChatConversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [chat]
      summary: Переименовать групповой чат (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameChatGroupRequest' }
      responses:
        '200':
          description: ChatConversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '400':
          description: Не группа (code=not_a_group) / пустое название
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [chat]
      summary: История сообщений (keyset, листаем вверх)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: before
          description: Курсор — created_at сообщения, от которого продолжаем листать вверх.
          schema: { type: string, format: date-time }
        - in: query
          name: threadRootId
          description: |
            Если задан — возвращает корень треда + все его ответы. Если не
            задан — возвращает только корневые сообщения (parent_message_id IS NULL).
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: Страница сообщений (старые → новые)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessagesPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [chat]
      summary: Отправить сообщение в диалог
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChatMessageRequest' }
      responses:
        '201':
          description: ChatMessage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
      - in: path
        name: messageId
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    patch:
      tags: [chat]
      summary: Редактировать своё сообщение (метка edited_at)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChatMessageRequest' }
      responses:
        '200':
          description: ChatMessage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Удалённое сообщение редактировать нельзя (code=deleted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [chat]
      summary: Soft-delete своего сообщения (admin может чужие)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/read:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [chat]
      summary: Отметить прочитанным до сообщения X
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkChatReadRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/group:
    post:
      tags: [chat]
      summary: Создать групповой чат
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChatGroupRequest' }
      responses:
        '201':
          description: ChatConversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '400':
          description: Невалидные данные (code=title_required / members_required / members_limit)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Часть участников не найдена (code=users_not_found)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /chat/conversations/{id}/members:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [chat]
      summary: Добавить участников в группу (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddChatMembersRequest' }
      responses:
        '200':
          description: ChatConversation (обновлённый состав)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '400':
          description: Лимит участников / не группа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
      - in: path
        name: userId
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    delete:
      tags: [chat]
      summary: Убрать участника (owner; сам себя — любой)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/leave:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [chat]
      summary: Выйти из группы (синоним DELETE /members/{me})
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/mute:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [chat]
      summary: Mute/unmute диалога (until=null → снять)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatMuteRequest' }
      responses:
        '200':
          description: ChatConversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [chat]
      summary: Скрыть диалог из моего списка
      responses:
        '200':
          description: ChatConversation (myHiddenAt установлен)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [chat]
      summary: Вернуть диалог в мой список
      responses:
        '200':
          description: ChatConversation (myHiddenAt = null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/search:
    get:
      tags: [chat]
      summary: Полнотекстовый поиск по доступным сообщениям
      description: |
        Использует Postgres FTS с конфигом `russian` (словоформы:
        «тестирую/тестировал/тестирование» матчатся по «тест»). Поиск идёт
        только по сообщениям тех диалогов, где запрашивающий — участник.
        Удалённые сообщения скрыты.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - in: query
          name: conversationId
          description: Если задан — поиск ограничен этим диалогом.
          schema: { $ref: '#/components/schemas/UUID' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Найденные сообщения с HTML-сниппетами.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSearchResponse' }
  /chat/conversations/{id}/messages/{messageId}/reactions/toggle:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
      - in: path
        name: messageId
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    post:
      tags: [chat]
      summary: Поставить / снять эмодзи-реакцию на сообщение
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleChatReactionRequest' }
      responses:
        '200':
          description: ChatMessage с обновлённой группой реакций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Удалённое сообщение не реагируется (code=deleted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  # ─────────────── NOTIFICATIONS ───────────────
  /notifications:
    get:
      tags: [notifications]
      summary: Уведомления пользователя
      responses:
        '200':
          description: Список уведомлений
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    patch:
      tags: [notifications]
      summary: Отметить уведомление прочитанным
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Отметить все прочитанными
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ─────────────── AUDIT ───────────────
  /audit:
    get:
      tags: [audit]
      summary: Журнал аудита с фильтрами
      parameters:
        - { in: query, name: entityType, schema: { type: string } }
        - { in: query, name: entityId,   schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: actorId,    schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: field,      schema: { type: string } }
        - { in: query, name: dateFrom,   schema: { type: string, format: date } }
        - { in: query, name: dateTo,     schema: { type: string, format: date } }
        - { in: query, name: search,     schema: { type: string } }
      responses:
        '200':
          description: Аудит
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }

  # ─────────────── ANALYTICS ───────────────
  /analytics/summary:
    get:
      tags: [analytics]
      summary: Сводка дашборда (KPI + дельты за период)
      parameters:
        - { in: query, name: from,    schema: { type: string, format: date-time }, description: "Начало периода (ISO-8601). По умолчанию — начало текущего месяца." }
        - { in: query, name: to,      schema: { type: string, format: date-time }, description: "Конец периода (ISO-8601). По умолчанию — сейчас." }
        - { in: query, name: compare, schema: { $ref: '#/components/schemas/CompareMode' }, description: "Окно для расчёта delta. По умолчанию prev." }
      responses:
        '200':
          description: DashboardSummary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
  /analytics/funnel:
    get:
      tags: [analytics]
      summary: Воронка по статусам вакансий
      responses:
        '200':
          description: FunnelBucket[]
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FunnelBucket' }
  /analytics/recruiter-load:
    get:
      tags: [analytics]
      summary: Нагрузка рекрутеров
      responses:
        '200':
          description: RecruiterLoad[]
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecruiterLoad' }
  /analytics/trends:
    get:
      tags: [analytics]
      summary: Временные ряды за период (создано/закрыто вакансий, заведено кандидатов, наймы)
      parameters:
        - { in: query, name: from,        schema: { type: string, format: date-time } }
        - { in: query, name: to,          schema: { type: string, format: date-time } }
        - { in: query, name: granularity, schema: { $ref: '#/components/schemas/Granularity' } }
      responses:
        '200':
          description: TrendsResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendsResponse' }
  /analytics/funnel-v2:
    get:
      tags: [analytics]
      summary: Воронка с конверсиями и drop-off по VacancyCandidate
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to,   schema: { type: string, format: date-time } }
      responses:
        '200':
          description: FunnelResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunnelResponse' }
  /analytics/time-to-hire:
    get:
      tags: [analytics]
      summary: Скорость найма за период
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to,   schema: { type: string, format: date-time } }
      responses:
        '200':
          description: TimeToHireResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeToHireResponse' }
  /analytics/attention:
    get:
      tags: [analytics]
      summary: Требует внимания (SLA, дедлайны, зависшие)
      parameters:
        - { in: query, name: top, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200':
          description: AttentionResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttentionResponse' }
  /analytics/recruiter-performance:
    get:
      tags: [analytics]
      summary: Эффективность рекрутеров за период
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to,   schema: { type: string, format: date-time } }
      responses:
        '200':
          description: RecruiterPerformanceResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterPerformanceResponse' }
  /analytics/client-performance:
    get:
      tags: [analytics]
      summary: Аналитика по клиентам за период
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to,   schema: { type: string, format: date-time } }
      responses:
        '200':
          description: ClientPerformanceResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPerformanceResponse' }
  /analytics/weekly-activity:
    get:
      tags: [analytics]
      summary: Итоги недели — новые вакансии и поданные кандидаты за окно
      description: >-
        Без параметров окно — текущая рабочая неделя (понедельник 00:00 UTC →
        сейчас). Фронт передаёт границы недели, посчитанные в локальной
        таймзоне пользователя.
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to,   schema: { type: string, format: date-time } }
      responses:
        '200':
          description: WeeklyActivityResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyActivityResponse' }
  /analytics/chat:
    get:
      tags: [analytics]
      summary: Метрики чата (Этап 6 чата)
      responses:
        '200':
          description: ChatStats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatStats' }
  /analytics/worklog/summary:
    get:
      tags: [analytics]
      summary: Учёт времени — суммарное время по сотрудникам за период
      description: >-
        Только для администраторов (role=admin). Прочие роли → 403. Без userId
        возвращает всех сотрудников, с userId — конкретного.
      parameters:
        - { in: query, name: from,   schema: { type: string, format: date-time } }
        - { in: query, name: to,     schema: { type: string, format: date-time } }
        - { in: query, name: userId, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: WorklogSummaryResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorklogSummaryResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /analytics/worklog/sessions:
    get:
      tags: [analytics]
      summary: Учёт времени — сырые интервалы пользователя за период
      parameters:
        - { in: query, name: from,   schema: { type: string, format: date-time } }
        - { in: query, name: to,     schema: { type: string, format: date-time } }
        - { in: query, name: userId, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Список интервалов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorklogSession' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────── FILES ───────────────
  /files/presign:
    post:
      tags: [files]
      summary: Получить presigned URL для загрузки файла в S3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignRequest' }
      responses:
        '200':
          description: PresignResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignResponse' }
        '422':
          description: Неподдерживаемый MIME или превышен размер (unsupported_mime / file_too_large)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /files/confirm:
    post:
      tags: [files]
      summary: Подтвердить загрузку (создаёт запись в БД, ставит scan_status=pending)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
      responses:
        '200':
          description: FileResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileResponse' }
  /files:
    get:
      tags: [files]
      summary: Файлы сущности
      parameters:
        - { in: query, name: entityType, required: true, schema: { $ref: '#/components/schemas/FileEntityType' } }
        - { in: query, name: entityId,   required: true, schema: { $ref: '#/components/schemas/UUID' } }
      responses:
        '200':
          description: Список файлов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FileResponse' }
  /files/{id}/download:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [files]
      summary: Временный URL для скачивания
      responses:
        '200':
          description: DownloadResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Файл найден антивирусом как заражённый (file_infected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /files/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    delete:
      tags: [files]
      summary: Удалить файл (владелец или admin)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────── DOCUMENTS ───────────────
  /documents:
    get:
      tags: [documents]
      summary: Список документов с фильтрами
      description: |
        Возвращает плоский список документов с пагинацией. Папки идут как обычные
        записи (`kind=folder`), вложенность определяется по `parentId`.
        Фильтры комбинируются. Поле `q` ищет по `title`, `description`, `owner`,
        `tags`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: section,    schema: { $ref: '#/components/schemas/DocumentSectionId' } }
        - { in: query, name: parentId,   schema: { $ref: '#/components/schemas/UUID' }, description: 'Если задан — только дети этой папки. Null = корень раздела.' }
        - { in: query, name: kind,       schema: { $ref: '#/components/schemas/DocumentKind' } }
        - { in: query, name: tag,        schema: { type: string } }
        - { in: query, name: favorite,   schema: { type: boolean } }
        - { in: query, name: q,          schema: { type: string } }
        - { in: query, name: ownerId,    schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: sortBy,     schema: { type: string, enum: [updated, oldest, title, owner, kind], default: updated } }
        - { in: query, name: sortDir,    schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Страница документов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPage' }
    post:
      tags: [documents]
      summary: Создать документ или папку
      description: |
        Если передан `fileId` — документ считается прикреплённым к ранее загруженному
        файлу (см. `/files/confirm`). Папка создаётся с `kind=folder` без `fileId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentRequest' }
      responses:
        '201':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Неверные данные (invalid_section / invalid_parent / parent_not_folder)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /documents/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [documents]
      summary: Получить документ
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [documents]
      summary: Обновить метаданные (title, emoji, tags, description, owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDocumentRequest' }
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [documents]
      summary: Удалить документ или папку
      description: |
        Удаление папки рекурсивно удаляет всё её содержимое. Файлы в S3 не удаляются
        автоматически — они остаются по `DELETE /files/{id}` отдельно.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{id}/move:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [documents]
      summary: Переместить документ в другой раздел/папку
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveDocumentRequest' }
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Целевая папка некорректна (parent_not_folder / cycle_detected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /documents/bulk-move:
    post:
      tags: [documents]
      summary: Массовое перемещение (для toolbar)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkMoveDocumentsRequest' }
      responses:
        '200':
          description: Количество перемещённых
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved: { type: integer, minimum: 0 }
  /documents/bulk-delete:
    post:
      tags: [documents]
      summary: Массовое удаление
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { $ref: '#/components/schemas/UUID' } }
      responses:
        '200':
          description: Количество удалённых
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
  /documents/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [documents]
      summary: Дублировать документ (без копирования файла; ссылка на тот же fileId)
      responses:
        '201':
          description: Document (копия)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    put:
      tags: [documents]
      summary: Добавить/убрать из избранного текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [documents]
      summary: История версий документа
      responses:
        '200':
          description: Список версий (новые сверху)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentVersion' }
    post:
      tags: [documents]
      summary: Сохранить новую версию
      description: |
        Метка `label` обязательна (например, `v2`, `draft`). `fileId` опционален —
        если передан, версия привязывается к новой загрузке файла.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentVersionRequest' }
      responses:
        '201':
          description: DocumentVersion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [documents]
      summary: Комментарии к документу (старые сверху)
      responses:
        '200':
          description: Список комментариев
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentComment' }
    post:
      tags: [documents]
      summary: Добавить комментарий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: DocumentComment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentComment' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────── PERMISSIONS MATRIX ───────────────
  /permissions-matrix:
    get:
      tags: [permissions]
      summary: Матрица прав
      responses:
        '200':
          description: Матрица
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MatrixPermission' }
  /permissions-matrix/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      tags: [permissions]
      summary: Обновить строку матрицы (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matrix]
              properties:
                matrix:
                  type: object
                  additionalProperties: { type: boolean }
                  description: 'Словарь { role: boolean }'
      responses:
        '200':
          description: MatrixPermission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatrixPermission' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /permissions-matrix/reset:
    post:
      tags: [permissions]
      summary: Сбросить матрицу к дефолту (admin)
      responses:
        '200':
          description: Матрица
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MatrixPermission' }

  /calendar/events:
    get:
      tags: [calendar]
      summary: События календаря в диапазоне дат
      description: |
        Возвращает «толстые» события (с именем кандидата и названием вакансии),
        начало которых попадает в полуинтервал [from, to). Видимость: admin и
        account_manager видят все события, остальные — только те, где они
        участники, автор или ответственны по вакансии события.
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to,   required: true, schema: { type: string, format: date-time } }
        - { in: query, name: recruiterId, schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: vacancyId,   schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: candidateId, schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/EventStatus' } }
        - { in: query, name: type,   schema: { $ref: '#/components/schemas/EventType' } }
      responses:
        '200':
          description: Список событий
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
    post:
      tags: [calendar]
      summary: Создать событие (собеседование)
      description: |
        Если `title` не передан — генерируется автоматически («Собес: ФИО —
        Вакансия»). При `matchId` и `type=interview` связка кандидат↔вакансия
        переводится в стадию `interview` (если была раньше по воронке).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '201':
          description: CalendarEvent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /calendar/events/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [calendar]
      summary: Получить событие
      responses:
        '200':
          description: CalendarEvent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [calendar]
      summary: Обновить / перенести событие
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventRequest' }
      responses:
        '200':
          description: CalendarEvent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [calendar]
      summary: Удалить событие
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /calendar/events/{id}/outcome:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [calendar]
      summary: Отметить исход (состоялось / не пришёл)
      description: |
        `status` ожидается `held` или `no_show`. При наличии `matchId` у события
        `outcome` пишется в `feedback` связки, а `nextMatchStatus` (если задан)
        переводит связку в новый статус.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutcomeRequest' }
      responses:
        '200':
          description: CalendarEvent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: invalid_outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /calendar/events/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [calendar]
      summary: Отменить событие
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        '200':
          description: CalendarEvent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────── SCREENINGS (AI-скрининг) ───────────────
  /screenings:
    get:
      tags: [screenings]
      summary: Список сессий скрининга
      description: |
        Видимость: admin и account_manager видят все сессии; остальные — свои
        (где ведущие) и сессии по вакансиям, где они назначены рекрутерами.
      parameters:
        - { in: query, name: candidateId, schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: vacancyId,   schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: recruiterId, schema: { $ref: '#/components/schemas/UUID' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/ScreeningStatus' } }
        - { in: query, name: page,     schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Страница сессий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningListResponse' }
    post:
      tags: [screenings]
      summary: Создать сессию скрининга
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScreeningRequest' }
      responses:
        '201':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /screenings/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    get:
      tags: [screenings]
      summary: Сессия скрининга
      responses:
        '200':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [screenings]
      summary: Обновить сессию (ссылка на Телемост, согласие на запись)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateScreeningRequest' }
      responses:
        '200':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [screenings]
      summary: Удалить сессию (ведущий или admin)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /screenings/{id}/start:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [screenings]
      summary: Начать встречу (draft → live)
      description: |
        Требует `consentConfirmed=true` — иначе 409 `consent_required`
        (запись без согласия кандидата не начинаем, 152-ФЗ). Идемпотентен
        для уже идущей сессии.
      responses:
        '200':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '409':
          description: consent_required | invalid_status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /screenings/{id}/finish:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [screenings]
      summary: Завершить встречу (live → done)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationSec: { type: integer, nullable: true }
      responses:
        '200':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '409':
          description: invalid_status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /screenings/{id}/audio:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [screenings]
      summary: Привязать запись разговора (файл из /files, entityType=screening)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '400':
          description: file_entity_mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /screenings/{id}/questions:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
    post:
      tags: [screenings]
      summary: Добавить вопрос в чек-лист
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:     { type: string }
                goal:     { type: string, nullable: true }
                position: { type: integer, nullable: true }
      responses:
        '200':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '422':
          description: empty_question
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /screenings/{id}/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/UuidPathId'
      - { in: path, name: questionId, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    patch:
      tags: [screenings]
      summary: Изменить вопрос (текст / статус / порядок)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:     { type: string, nullable: true }
                goal:     { type: string, nullable: true }
                status:   { $ref: '#/components/schemas/ScreeningQuestionStatus' }
                position: { type: integer, nullable: true }
      responses:
        '200':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [screenings]
      summary: Удалить вопрос
      responses:
        '200':
          description: ScreeningSession
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningSession' }
        '404': { $ref: '#/components/responses/NotFound' }


# ───────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UuidPathId:
      in: path
      name: id
      required: true
      schema: { $ref: '#/components/schemas/UUID' }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, enum: [true] }
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Нет прав
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Слишком много запросов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    UUID:
      type: string
      format: uuid

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, description: 'Машиночитаемый код, например engagement_type_mismatch' }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    # ─── Auth ───
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:  { type: string }
        refreshToken: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword:     { type: string, minLength: 8, maxLength: 128 }

    SetPasswordRequest:
      description: Админский сброс пароля другому пользователю (без текущего пароля).
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128 }

    # ─── Users ───
    Role:
      type: string
      enum: [admin, account_manager, recruiter, viewer]
    User:
      type: object
      required: [id, email, fullName, role, initials, color, isActive]
      properties:
        id:       { $ref: '#/components/schemas/UUID' }
        email:    { type: string, format: email }
        telegram: { type: string, nullable: true }
        fullName: { type: string }
        role:     { $ref: '#/components/schemas/Role' }
        initials: { type: string }
        color:    { type: string }
        isActive: { type: boolean }
    CreateUserRequest:
      type: object
      required: [email, fullName, role]
      properties:
        email:    { type: string, format: email }
        telegram: { type: string }
        fullName: { type: string }
        role:     { $ref: '#/components/schemas/Role' }
        password: { type: string, minLength: 8 }
        isActive: { type: boolean }
    UpdateUserRequest:
      type: object
      properties:
        email:    { type: string, format: email }
        telegram: { type: string, nullable: true }
        fullName: { type: string }
        role:     { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
    CreateUserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
        inviteUrl:
          type: string
          nullable: true
          description: Заполняется только если SMTP не настроен и письмо не ушло.
    InviteResendResponse:
      type: object
      required: [user, emailSent]
      properties:
        user: { $ref: '#/components/schemas/User' }
        inviteUrl:
          type: string
          nullable: true
        emailSent:
          type: boolean
          description: true — письмо реально ушло через SMTP; false — fallback на inviteUrl.
    InviteInfo:
      type: object
      required: [email, fullName]
      properties:
        email:    { type: string, format: email }
        fullName: { type: string }
    ActivateInviteRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128 }

    # ─── Clients ───
    ClientStatus:
      type: string
      enum: [lead, in_progress, active, paused, archived]
    ClientKind:
      type: string
      enum: [direct, intermediary]
      description: Прямой клиент / посредник
    LegalEntity:
      type: object
      required: [id, name, inn]
      properties:
        id:   { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        inn:  { type: string }
    Client:
      type: object
      required: [id, name, legalEntities, industry, status, clientKind, vacanciesCount, contactsCount]
      properties:
        id:               { $ref: '#/components/schemas/UUID' }
        name:             { type: string }
        legalEntities:
          type: array
          items: { $ref: '#/components/schemas/LegalEntity' }
        industry:         { type: string }
        # Может быть null: ответственного «отвязали» при удалении пользователя.
        accountManagerId: { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        status:           { $ref: '#/components/schemas/ClientStatus' }
        clientKind:       { $ref: '#/components/schemas/ClientKind' }
        telegramChat:     { type: string, nullable: true }
        vacanciesCount:   { type: integer, minimum: 0 }
        contactsCount:    { type: integer, minimum: 0 }
    CreateClientRequest:
      type: object
      required: [name, industry, status, clientKind]
      properties:
        name:             { type: string }
        legalEntities:
          type: array
          items:
            type: object
            required: [name, inn]
            properties:
              id:   { $ref: '#/components/schemas/UUID' }
              name: { type: string }
              inn:  { type: string }
        industry:         { type: string }
        # AM опционален: клиент может существовать без ответственного.
        accountManagerId: { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        status:           { $ref: '#/components/schemas/ClientStatus' }
        clientKind:       { $ref: '#/components/schemas/ClientKind' }
        telegramChat:     { type: string }
    UpdateClientRequest:
      allOf:
        - $ref: '#/components/schemas/CreateClientRequest'
        - type: object
      description: Все поля опциональны (Partial<Client>)

    # ─── Contacts ───
    Contact:
      type: object
      required: [id, clientId, name, role]
      properties:
        id:       { $ref: '#/components/schemas/UUID' }
        clientId: { $ref: '#/components/schemas/UUID' }
        name:     { type: string }
        role:     { type: string }
        email:    { type: string, format: email, nullable: true }
        phone:    { type: string, nullable: true }
        telegram: { type: string, nullable: true }
        birthday:
          type: string
          format: date
          nullable: true
          description: ISO date YYYY-MM-DD
    ContactListItem:
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          required: [clientName]
          properties:
            clientName: { type: string }
    CreateContactRequest:
      type: object
      required: [name, role]
      properties:
        name:     { type: string }
        role:     { type: string }
        email:    { type: string, format: email }
        phone:    { type: string }
        telegram: { type: string }
        birthday: { type: string, format: date }

    # ─── Vacancies ───
    Grade:
      type: string
      enum: [Junior, Middle, Senior, Lead]
    WorkFormat:
      type: string
      enum: ['Удалённо', 'Гибрид', 'Офис']
    Priority:
      type: string
      enum: [low, medium, high, urgent]
    EngagementType:
      type: string
      enum: [outstaff, agency]
      description: Тип сделки/кандидата
    VacancyStatus:
      type: string
      enum: [new, in_work, proposed, interview, waiting_os, closed_success, closed, paused]
    Vacancy:
      type: object
      required:
        - id
        - title
        - clientId
        - engagementType
        - grade
        - stack
        - format
        - rateClient
        - positions
        - status
        - priority
        - recruiterIds
        - daysInStatus
        - candidatesCount
        - kanbanOrder
      properties:
        id:                { $ref: '#/components/schemas/UUID' }
        title:             { type: string }
        clientId:          { $ref: '#/components/schemas/UUID' }
        engagementType:    { $ref: '#/components/schemas/EngagementType' }
        project:           { type: string, nullable: true }
        grade:             { $ref: '#/components/schemas/Grade' }
        stack:             { type: array, items: { type: string } }
        format:            { $ref: '#/components/schemas/WorkFormat' }
        rateClient:        { type: number, description: '₽/час' }
        salaryMax:         { type: number, nullable: true, description: '₽/мес, агентство' }
        positions:         { type: integer, minimum: 1 }
        status:            { $ref: '#/components/schemas/VacancyStatus' }
        priority:          { $ref: '#/components/schemas/Priority' }
        # Может быть null: ответственного «отвязали» при удалении пользователя.
        accountManagerId:  { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        recruiterIds:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
        daysInStatus:      { type: integer, minimum: 0 }
        candidatesCount:   { type: integer, minimum: 0 }
        deadline:          { type: string, format: date, nullable: true }
        kanbanOrder:       { type: integer }
        description:       { type: string, nullable: true }
        requirements:      { type: string, nullable: true }
    CreateVacancyRequest:
      type: object
      required: [title, clientId, engagementType, grade, format, positions, status, priority]
      properties:
        title:            { type: string }
        clientId:         { $ref: '#/components/schemas/UUID' }
        engagementType:   { $ref: '#/components/schemas/EngagementType' }
        project:          { type: string }
        grade:            { $ref: '#/components/schemas/Grade' }
        stack:            { type: array, items: { type: string } }
        format:           { $ref: '#/components/schemas/WorkFormat' }
        rateClient:       { type: number }
        salaryMax:        { type: number, nullable: true }
        positions:        { type: integer, minimum: 1 }
        status:           { $ref: '#/components/schemas/VacancyStatus' }
        priority:         { $ref: '#/components/schemas/Priority' }
        # AM опционален: вакансию можно завести без ответственного.
        accountManagerId: { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        recruiterIds:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
        deadline:         { type: string, format: date, nullable: true }
        description:      { type: string }
        requirements:     { type: string }
    UpdateVacancyRequest:
      allOf:
        - $ref: '#/components/schemas/CreateVacancyRequest'
        - type: object
      description: Partial<Vacancy>
    TransitionsResponse:
      type: object
      required: [transitions, finalStatuses]
      properties:
        transitions:
          type: object
          description: 'Словарь { fromStatus: [allowedTo...] }'
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/VacancyStatus' }
        finalStatuses:
          type: array
          items: { $ref: '#/components/schemas/VacancyStatus' }
    ParsedVacancy:
      type: object
      properties:
        title:        { type: string }
        project:      { type: string }
        grade:        { $ref: '#/components/schemas/Grade' }
        format:       { $ref: '#/components/schemas/WorkFormat' }
        priority:     { $ref: '#/components/schemas/Priority' }
        rateClient:   { type: number }
        deadline:     { type: string, format: date }
        stack:        { type: string, description: 'CSV-список технологий' }
        description:  { type: string }
        requirements: { type: string }

    # ─── Candidates ───
    CandidateStatus:
      type: string
      enum:
        - new
        - recruiter_iv
        - ready
        - presented
        - waiting_os
        - offer
        - rejected_client
        - rejected_candidate
        - hired
        - reserve
    EmploymentType:
      type: string
      enum: ['ИП', 'СМЗ', 'ТК РФ']
    LanguageLevel:
      type: string
      enum: ['A1', 'A2', 'B1', 'B2', 'C1', 'C2', 'родной']
    SkillCategory:
      type: object
      required: [id, name, items]
      properties:
        id:    { type: string }
        name:  { type: string }
        items: { type: array, items: { type: string } }
    CandidateExperience:
      type: object
      required: [id, company, position, startMonth, achievements, stack]
      properties:
        id:           { type: string }
        company:      { type: string }
        position:     { type: string }
        startMonth:   { type: string, description: 'YYYY-MM' }
        endMonth:     { type: string, nullable: true, description: 'YYYY-MM или null = «по настоящее время»' }
        project:      { type: string }
        achievements: { type: array, items: { type: string } }
        stack:        { type: array, items: { type: string } }
    CandidateEducation:
      type: object
      required: [id, degree, institution, graduationYear]
      properties:
        id:             { type: string }
        degree:         { type: string }
        institution:    { type: string }
        city:           { type: string }
        graduationYear: { type: integer }
        specialty:      { type: string }
    CandidateCertification:
      type: object
      required: [id, title, issuer]
      properties:
        id:     { type: string }
        title:  { type: string }
        issuer: { type: string }
        period: { type: string }
    CandidateLanguage:
      type: object
      required: [language, level]
      properties:
        language: { type: string }
        level:    { $ref: '#/components/schemas/LanguageLevel' }
    Candidate:
      type: object
      required:
        - id
        - fullName
        - role
        - engagementType
        - grade
        - experienceYears
        - stack
        - rateMonth
        - employmentType
        - format
        - location
        - status
        - daysInStatus
        - vacancyIds
        - kanbanOrder
      properties:
        id:               { $ref: '#/components/schemas/UUID' }
        fullName:         { type: string }
        role:             { type: string }
        engagementType:   { $ref: '#/components/schemas/EngagementType' }
        grade:            { $ref: '#/components/schemas/Grade' }
        experienceYears:  { type: number }
        stack:            { type: array, items: { type: string } }
        rateMonth:        { type: number, nullable: true, description: '₽/мес. Скрыто для ролей без прав на чувствительные поля.' }
        employmentType:   { $ref: '#/components/schemas/EmploymentType' }
        format:           { $ref: '#/components/schemas/WorkFormat' }
        location:         { type: string }
        # Может быть null: рекрутера «отвязали» при удалении пользователя.
        recruiterId:      { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        status:           { $ref: '#/components/schemas/CandidateStatus' }
        daysInStatus:     { type: integer, minimum: 0 }
        vacancyIds:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
        telegram:         { type: string, nullable: true }
        phone:            { type: string, nullable: true, description: 'Скрыто для ролей без прав' }
        email:            { type: string, format: email, nullable: true, description: 'Скрыто для ролей без прав' }
        birthday:         { type: string, format: date, nullable: true }
        kanbanOrder:      { type: integer }
        summary:          { type: string }
        skillCategories:
          type: array
          items: { $ref: '#/components/schemas/SkillCategory' }
        experience:
          type: array
          items: { $ref: '#/components/schemas/CandidateExperience' }
        education:
          type: array
          items: { $ref: '#/components/schemas/CandidateEducation' }
        certifications:
          type: array
          items: { $ref: '#/components/schemas/CandidateCertification' }
        languages:
          type: array
          items: { $ref: '#/components/schemas/CandidateLanguage' }
        archived:       { type: boolean }
        archivedAt:     { type: string, format: date-time, nullable: true }
        archivedById:   { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        archiveReason:  { type: string }
    CreateCandidateRequest:
      type: object
      required: [fullName, role, engagementType, grade, employmentType, format]
      properties:
        fullName:        { type: string }
        role:            { type: string }
        engagementType:  { $ref: '#/components/schemas/EngagementType' }
        grade:           { $ref: '#/components/schemas/Grade' }
        experienceYears: { type: number }
        stack:           { type: array, items: { type: string } }
        rateMonth:       { type: number }
        employmentType:  { $ref: '#/components/schemas/EmploymentType' }
        format:          { $ref: '#/components/schemas/WorkFormat' }
        location:        { type: string }
        # Опционально: можно завести кандидата без ответственного.
        recruiterId:     { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        status:          { $ref: '#/components/schemas/CandidateStatus' }
        telegram:        { type: string }
        phone:           { type: string }
        email:           { type: string, format: email }
        birthday:        { type: string, format: date }
        summary:         { type: string }
        skillCategories:
          type: array
          items: { $ref: '#/components/schemas/SkillCategory' }
        experience:
          type: array
          items: { $ref: '#/components/schemas/CandidateExperience' }
        education:
          type: array
          items: { $ref: '#/components/schemas/CandidateEducation' }
        certifications:
          type: array
          items: { $ref: '#/components/schemas/CandidateCertification' }
        languages:
          type: array
          items: { $ref: '#/components/schemas/CandidateLanguage' }
    UpdateCandidateRequest:
      allOf:
        - $ref: '#/components/schemas/CreateCandidateRequest'
        - type: object
      description: Partial<Candidate>
    # ─── Parsed candidate (AI-распознавание резюме) ───
    # Похож на Candidate, но БЕЗ полей `id` во вложенных блоках (фронт сам
    # выставит useFieldArray-id). Все поля опциональны: AI возвращает только
    # то, что явно распознал.
    ParsedSkillCategory:
      type: object
      required: [name, items]
      properties:
        name:  { type: string }
        items: { type: array, items: { type: string } }
    ParsedExperience:
      type: object
      required: [company, position, startMonth]
      properties:
        company:      { type: string }
        position:     { type: string }
        startMonth:   { type: string, description: 'YYYY-MM' }
        endMonth:     { type: string, description: 'YYYY-MM или "" = «по настоящее время»' }
        project:      { type: string }
        achievements: { type: array, items: { type: string } }
        stack:        { type: array, items: { type: string } }
    ParsedEducation:
      type: object
      required: [degree, institution, graduationYear]
      properties:
        degree:         { type: string }
        institution:    { type: string }
        city:           { type: string }
        graduationYear: { type: integer }
        specialty:      { type: string }
    ParsedCertification:
      type: object
      required: [title, issuer]
      properties:
        title:  { type: string }
        issuer: { type: string }
        period: { type: string }
    ParsedLanguageItem:
      type: object
      required: [language, level]
      properties:
        language: { type: string }
        level:    { $ref: '#/components/schemas/LanguageLevel' }
    ParsedCandidate:
      type: object
      properties:
        fullName:        { type: string }
        role:            { type: string }
        grade:           { $ref: '#/components/schemas/Grade' }
        experienceYears: { type: number }
        format:          { $ref: '#/components/schemas/WorkFormat' }
        rateMonth:       { type: number }
        location:        { type: string }
        birthday:        { type: string, format: date }
        telegram:        { type: string }
        phone:           { type: string }
        email:           { type: string }
        stack:           { type: string, description: 'CSV-список технологий' }
        summary:         { type: string }
        skillCategories: { type: array, items: { $ref: '#/components/schemas/ParsedSkillCategory' } }
        experience:      { type: array, items: { $ref: '#/components/schemas/ParsedExperience' } }
        education:       { type: array, items: { $ref: '#/components/schemas/ParsedEducation' } }
        certifications:  { type: array, items: { $ref: '#/components/schemas/ParsedCertification' } }
        languages:       { type: array, items: { $ref: '#/components/schemas/ParsedLanguageItem' } }

    # ─── Improved resume (AI-адаптация под вакансию) ───
    # Все поля опциональны. Список `experience` — той же длины и в том же
    # порядке, что у кандидата (модель не может выдумывать новые места работы).
    # Менять разрешено только `project` и `achievements` внутри блока.
    ImprovedExperienceItem:
      type: object
      properties:
        project:      { type: string }
        achievements: { type: array, items: { type: string } }
    ImprovedResume:
      type: object
      properties:
        summary:         { type: string }
        experienceYears: { type: number }
        stack:           { type: array, items: { type: string } }
        skillCategories: { type: array, items: { $ref: '#/components/schemas/ParsedSkillCategory' } }
        experience:      { type: array, items: { $ref: '#/components/schemas/ImprovedExperienceItem' } }

    # ─── Matching ───
    MatchStatus:
      type: string
      enum: [submitted, reviewed, interview, offered, accepted, rejected_client, rejected_internal]
    VacancyCandidate:
      type: object
      required: [id, vacancyId, candidateId, status, addedById, addedAt]
      properties:
        id:           { type: string, description: 'UUID или синтетический id в моках' }
        vacancyId:    { $ref: '#/components/schemas/UUID' }
        candidateId:  { $ref: '#/components/schemas/UUID' }
        status:       { $ref: '#/components/schemas/MatchStatus' }
        addedById:    { $ref: '#/components/schemas/UUID' }
        addedAt:      { type: string, format: date-time }
        feedback:     { type: string, nullable: true }

    # ─── Comments ───
    CommentEntityType:
      type: string
      enum: [contact, candidate, vacancy, client]
    Comment:
      type: object
      required: [id, entityType, entityId, parentId, text, mentions, createdAt, updatedAt]
      properties:
        id:         { $ref: '#/components/schemas/UUID' }
        entityType: { $ref: '#/components/schemas/CommentEntityType' }
        entityId:   { $ref: '#/components/schemas/UUID' }
        # Может быть null: автор удалён.
        authorId:   { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        parentId:
          allOf: [{ $ref: '#/components/schemas/UUID' }]
          nullable: true
        text:       { type: string }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
        createdAt:  { type: string, format: date-time }
        updatedAt:  { type: string, format: date-time, nullable: true }
    CreateCommentRequest:
      type: object
      required: [entityType, entityId, text]
      properties:
        entityType: { $ref: '#/components/schemas/CommentEntityType' }
        entityId:   { $ref: '#/components/schemas/UUID' }
        text:       { type: string, minLength: 1 }
        parentId:
          allOf: [{ $ref: '#/components/schemas/UUID' }]
          nullable: true
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
    UpdateCommentRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UUID' }

    # ─── Chat ───
    ChatConversationKind:
      type: string
      enum: [dm, group]
    ChatConversation:
      type: object
      required: [id, kind, createdAt, memberIds]
      properties:
        id:             { $ref: '#/components/schemas/UUID' }
        kind:           { $ref: '#/components/schemas/ChatConversationKind' }
        title:          { type: string, nullable: true }
        createdBy:
          allOf: [{ $ref: '#/components/schemas/UUID' }]
          nullable: true
        createdAt:      { type: string, format: date-time }
        lastMessageAt:  { type: string, format: date-time, nullable: true }
        memberIds:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
        # Read-state именно текущего пользователя — у других в DTO не отдаётся.
        myLastReadMessageId:
          allOf: [{ $ref: '#/components/schemas/UUID' }]
          nullable: true
        myLastReadAt:
          type: string
          format: date-time
          nullable: true
        # Этап 6: персональные mute/archive текущего юзера.
        # `myMutedUntil > now()` — уведомления (Notification) приглушены, но
        # realtime-доставка сообщений работает.
        # `myHiddenAt != null` — диалог скрыт из моего списка (архив).
        myMutedUntil:
          type: string
          format: date-time
          nullable: true
        myHiddenAt:
          type: string
          format: date-time
          nullable: true
    CreateDmRequest:
      type: object
      required: [peerUserId]
      properties:
        peerUserId: { $ref: '#/components/schemas/UUID' }
    ChatReactionGroup:
      type: object
      required: [emoji, count, userIds, mineReacted]
      properties:
        emoji:        { type: string }
        count:        { type: integer, minimum: 1 }
        userIds:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
        mineReacted:  { type: boolean }
    ChatMessage:
      type: object
      required: [id, conversationId, text, mentions, reactions, attachments, replyCount, createdAt]
      properties:
        id:             { $ref: '#/components/schemas/UUID' }
        conversationId: { $ref: '#/components/schemas/UUID' }
        authorUserId:
          allOf: [{ $ref: '#/components/schemas/UUID' }]
          nullable: true
        # NULL — корневое сообщение основной ленты; задано — ответ в треде,
        # ссылка на корень (треды глубиной 1, см. §6 плана).
        parentMessageId:
          allOf: [{ $ref: '#/components/schemas/UUID' }]
          nullable: true
        # Для удалённых сообщений text='', mentions=[], reactions=[],
        # attachments=[] — фронт сам подменит на плейсхолдер «Сообщение
        # удалено». replyCount отдаётся всегда (видимые ответы у удалённого
        # корня).
        text:           { type: string }
        mentions:
          type: array
          description: UUID юзеров, упомянутых через токен `<@uuid>` в тексте.
          items: { $ref: '#/components/schemas/UUID' }
        reactions:
          type: array
          description: Эмодзи-реакции, сгруппированные по emoji.
          items: { $ref: '#/components/schemas/ChatReactionGroup' }
        attachments:
          type: array
          description: Файлы-вложения, прикреплённые к сообщению.
          items: { $ref: '#/components/schemas/FileResponse' }
        replyCount:
          type: integer
          minimum: 0
          description: Число ответов в треде (только для корневых сообщений).
        editedAt:       { type: string, format: date-time, nullable: true }
        deletedAt:      { type: string, format: date-time, nullable: true }
        createdAt:      { type: string, format: date-time }
    CreateChatMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 10000 }
        # Если задано — это ответ в тред. Корневое сообщение того же диалога.
        parentMessageId:
          allOf: [{ $ref: '#/components/schemas/UUID' }]
          nullable: true
        # ID файлов, уже подтверждённых через /files/confirm с
        # entity_type='chat_message'. Сервис пересвяжет их к id сообщения.
        fileIds:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/UUID' }
    UpdateChatMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 10000 }
    MarkChatReadRequest:
      type: object
      required: [lastReadMessageId]
      properties:
        lastReadMessageId: { $ref: '#/components/schemas/UUID' }
    CreateChatGroupRequest:
      type: object
      required: [title, memberIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        memberIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/UUID' }
    RenameChatGroupRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
    AddChatMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/UUID' }
    ToggleChatReactionRequest:
      type: object
      required: [emoji]
      properties:
        emoji: { type: string, minLength: 1, maxLength: 64 }
    ChatMuteRequest:
      type: object
      properties:
        until:
          type: string
          format: date-time
          nullable: true
          description: Время, до которого глушим уведомления. `null` снимает mute.
    ChatStats:
      type: object
      required: [messagesToday, messages7d, activeUsers7d, dmCount, groupCount, avgGroupSize]
      properties:
        messagesToday: { type: integer, minimum: 0 }
        messages7d:    { type: integer, minimum: 0 }
        activeUsers7d: { type: integer, minimum: 0 }
        dmCount:       { type: integer, minimum: 0 }
        groupCount:    { type: integer, minimum: 0 }
        avgGroupSize:  { type: number, format: float, minimum: 0 }
    ChatSearchHit:
      type: object
      required: [conversationId, message, snippet, rank]
      properties:
        conversationId: { $ref: '#/components/schemas/UUID' }
        message:        { $ref: '#/components/schemas/ChatMessage' }
        # HTML-фрагмент с <mark>...</mark> вокруг совпадений. Безопасно
        # рендерится через dangerouslySetInnerHTML — ts_headline экранирует
        # всё, кроме своих собственных тегов.
        snippet:        { type: string }
        rank:           { type: number, format: float }
    ChatSearchResponse:
      type: object
      required: [query, items]
      properties:
        query: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatSearchHit' }
    ChatMessagesPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        # ISO-время самого старого сообщения в страницe — передавайте обратно
        # как `?before=` для следующей страницы. null = больше нет.
        nextCursor:
          type: string
          format: date-time
          nullable: true

    # ─── Notifications ───
    Notification:
      type: object
      required: [id, userId, kind, text, read, createdAt]
      properties:
        id:        { $ref: '#/components/schemas/UUID' }
        userId:    { $ref: '#/components/schemas/UUID' }
        kind:
          type: string
          enum: [mention, status_change, system, assignment, comment, chat_message]
        text:      { type: string }
        entityType:
          type: string
          enum: [vacancy, candidate, client, contact, chat_message, event]
          nullable: true
        entityId:
          allOf: [{ $ref: '#/components/schemas/UUID' }]
          nullable: true
        payload:
          type: object
          additionalProperties: true
          description: >-
            Доп. данные для построения ссылки-перехода. Например, у chat_message
            entityId указывает на сообщение, а conversationId диалога лежит в
            payload.conversationId.
        read:      { type: boolean }
        createdAt: { type: string, format: date-time }

    # ─── Audit / Activity ───
    ActivityEntry:
      type: object
      required: [id, entityType, entityId, kind, text, createdAt]
      properties:
        id:         { $ref: '#/components/schemas/UUID' }
        entityType:
          type: string
          enum: [vacancy, candidate, client]
        entityId:   { $ref: '#/components/schemas/UUID' }
        # Может быть null: актёр удалён.
        actorId:    { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        kind:
          type: string
          enum: [create, status, note, call, email]
        text:       { type: string }
        createdAt:  { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, entityType, entityId, field, before, after, createdAt]
      properties:
        id:         { $ref: '#/components/schemas/UUID' }
        entityType: { type: string }
        entityId:   { $ref: '#/components/schemas/UUID' }
        # Может быть null: актёр удалён.
        actorId:    { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        field:      { type: string }
        before:     { type: string, nullable: true }
        after:      { type: string, nullable: true }
        createdAt:  { type: string, format: date-time }

    # ─── Analytics ───
    CompareMode:
      type: string
      enum: [prev, yoy, none]
    Granularity:
      type: string
      enum: [auto, day, week, month]
    PeriodWindow:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to:   { type: string, format: date-time }
    CompareWindow:
      type: object
      required: [from, to, mode]
      properties:
        from: { type: string, format: date-time }
        to:   { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/CompareMode' }
    DashboardSummary:
      type: object
      required: [openVacancies, activeCandidates, closedThisMonth, hiredThisMonth, delta, period]
      properties:
        openVacancies:    { type: integer }
        activeCandidates: { type: integer }
        closedThisMonth:  { type: integer }
        hiredThisMonth:   { type: integer }
        delta:
          type: object
          required: [openVacancies, activeCandidates, closedThisMonth, hiredThisMonth]
          properties:
            openVacancies:    { type: number }
            activeCandidates: { type: number }
            closedThisMonth:  { type: number }
            hiredThisMonth:   { type: number }
        period:  { $ref: '#/components/schemas/PeriodWindow' }
        compare: { $ref: '#/components/schemas/CompareWindow', nullable: true }
    FunnelBucket:
      type: object
      required: [status, count]
      properties:
        status: { $ref: '#/components/schemas/VacancyStatus' }
        count:  { type: integer }
    RecruiterLoad:
      type: object
      required: [recruiterId, activeCount]
      properties:
        recruiterId: { $ref: '#/components/schemas/UUID' }
        activeCount: { type: integer }
    TrendsPoint:
      type: object
      required: [bucket, value]
      properties:
        bucket: { type: string, format: date-time }
        value:  { type: integer }
    TrendsSeries:
      type: object
      required: [vacanciesCreated, vacanciesClosed, candidatesCreated, hires]
      properties:
        vacanciesCreated:   { type: array, items: { $ref: '#/components/schemas/TrendsPoint' } }
        vacanciesClosed:    { type: array, items: { $ref: '#/components/schemas/TrendsPoint' } }
        candidatesCreated:  { type: array, items: { $ref: '#/components/schemas/TrendsPoint' } }
        hires:              { type: array, items: { $ref: '#/components/schemas/TrendsPoint' } }
    TrendsResponse:
      type: object
      required: [granularity, period, series]
      properties:
        granularity: { type: string, enum: [day, week, month] }
        period:      { $ref: '#/components/schemas/PeriodWindow' }
        series:      { $ref: '#/components/schemas/TrendsSeries' }
    FunnelStage:
      type: object
      required: [status, count, conversionPct, dropOff]
      properties:
        status:         { $ref: '#/components/schemas/MatchStatus' }
        count:          { type: integer }
        conversionPct:  { type: number, description: "% к предыдущей стадии" }
        dropOff:        { type: integer, description: "абсолютный отток к этой стадии" }
    FunnelRejected:
      type: object
      required: [client, internal, total]
      properties:
        client:   { type: integer }
        internal: { type: integer }
        total:    { type: integer }
    FunnelResponse:
      type: object
      required: [stages, rejected, total, overallConversionPct, period]
      properties:
        stages:               { type: array, items: { $ref: '#/components/schemas/FunnelStage' } }
        rejected:             { $ref: '#/components/schemas/FunnelRejected' }
        total:                { type: integer }
        overallConversionPct: { type: number }
        period:               { $ref: '#/components/schemas/PeriodWindow' }
    TimeToHireBucket:
      type: object
      required: [label, count]
      properties:
        label:   { type: string }
        maxDays: { type: integer, nullable: true }
        count:   { type: integer }
    TimeInStage:
      type: object
      required: [status, avgDays, medianDays, sample]
      properties:
        status:     { type: string }
        avgDays:    { type: number }
        medianDays: { type: number }
        sample:     { type: integer }
    TimeToHireResponse:
      type: object
      required: [sampleSize, avgDays, medianDays, p90Days, distribution, byStage, period]
      properties:
        sampleSize:   { type: integer }
        avgDays:      { type: number }
        medianDays:   { type: number }
        p90Days:      { type: number }
        distribution: { type: array, items: { $ref: '#/components/schemas/TimeToHireBucket' } }
        byStage:      { type: array, items: { $ref: '#/components/schemas/TimeInStage' } }
        period:       { $ref: '#/components/schemas/PeriodWindow' }
    AttentionVacancyItem:
      type: object
      required: [id, title]
      properties:
        id:            { $ref: '#/components/schemas/UUID' }
        title:         { type: string }
        status:        { $ref: '#/components/schemas/VacancyStatus', nullable: true }
        daysInStatus:  { type: integer, nullable: true }
        daysOpen:      { type: integer, nullable: true }
        deadline:      { type: string, format: date-time, nullable: true }
        daysOverdue:   { type: integer, nullable: true }
        daysLeft:      { type: integer, nullable: true }
    AttentionCandidateItem:
      type: object
      required: [id, fullName, status, daysInStatus]
      properties:
        id:           { $ref: '#/components/schemas/UUID' }
        fullName:     { type: string }
        status:       { type: string }
        daysInStatus: { type: integer }
    AttentionVacancyBlock:
      type: object
      required: [total, items]
      properties:
        total:         { type: integer }
        thresholdDays: { type: integer, nullable: true }
        items:         { type: array, items: { $ref: '#/components/schemas/AttentionVacancyItem' } }
    AttentionCandidateBlock:
      type: object
      required: [total, items]
      properties:
        total:         { type: integer }
        thresholdDays: { type: integer, nullable: true }
        items:         { type: array, items: { $ref: '#/components/schemas/AttentionCandidateItem' } }
    AttentionCountOnly:
      type: object
      required: [total]
      properties:
        total: { type: integer }
    AttentionResponse:
      type: object
      required:
        - stuckVacancies
        - stuckCandidates
        - vacanciesWithoutCandidates
        - overdueDeadlines
        - deadlinesNext7Days
        - deadlinesNext14Days
      properties:
        stuckVacancies:             { $ref: '#/components/schemas/AttentionVacancyBlock' }
        stuckCandidates:            { $ref: '#/components/schemas/AttentionCandidateBlock' }
        vacanciesWithoutCandidates: { $ref: '#/components/schemas/AttentionVacancyBlock' }
        overdueDeadlines:           { $ref: '#/components/schemas/AttentionVacancyBlock' }
        deadlinesNext7Days:         { $ref: '#/components/schemas/AttentionVacancyBlock' }
        deadlinesNext14Days:        { $ref: '#/components/schemas/AttentionCountOnly' }
    RecruiterMetric:
      type: object
      required:
        - recruiterId
        - fullName
        - candidatesCreated
        - presented
        - hired
        - hireRatePct
        - avgTimeToHireDays
        - totalMargin
        - sparkline
      properties:
        recruiterId:        { $ref: '#/components/schemas/UUID' }
        fullName:           { type: string }
        candidatesCreated:  { type: integer }
        presented:          { type: integer }
        hired:              { type: integer }
        hireRatePct:        { type: number, description: "hired / presented, %" }
        avgTimeToHireDays:  { type: number }
        totalMargin:        { type: number, description: "сумма (rate_client*160 − rate_month) по hired в ₽/мес" }
        sparkline:          { type: array, items: { type: integer }, description: "Hires по 8 недельным бакетам" }
    RecruiterPerformanceResponse:
      type: object
      required: [items, period]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/RecruiterMetric' } }
        period: { $ref: '#/components/schemas/PeriodWindow' }
    ClientHealthFlag:
      type: string
      enum: [stale, no_open, high_rejection, no_vacancies_ever]
    ClientMetric:
      type: object
      required:
        - clientId
        - name
        - industry
        - vacanciesTotal
        - vacanciesOpen
        - vacanciesClosedInPeriod
        - hiresInPeriod
        - avgTimeToFillDays
        - monthlyMarginRunRate
        - presentedToHiredPct
        - rejectionRatePct
        - healthFlags
        - sparkline
      properties:
        clientId:                 { $ref: '#/components/schemas/UUID' }
        name:                     { type: string }
        industry:                 { type: string }
        status:                   { $ref: '#/components/schemas/ClientStatus', nullable: true }
        clientKind:               { $ref: '#/components/schemas/ClientKind', nullable: true }
        vacanciesTotal:           { type: integer }
        vacanciesOpen:            { type: integer }
        vacanciesClosedInPeriod:  { type: integer }
        hiresInPeriod:            { type: integer }
        avgTimeToFillDays:        { type: number }
        monthlyMarginRunRate:     { type: number }
        presentedToHiredPct:      { type: number }
        lastVacancyAt:            { type: string, format: date-time, nullable: true }
        daysSinceLastVacancy:     { type: integer, nullable: true }
        rejectionRatePct:         { type: number }
        healthFlags:              { type: array, items: { $ref: '#/components/schemas/ClientHealthFlag' } }
        sparkline:                { type: array, items: { type: integer } }
    ClientPerformanceResponse:
      type: object
      required: [items, period]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/ClientMetric' } }
        period: { $ref: '#/components/schemas/PeriodWindow' }

    # ─── Weekly activity («Итоги недели») ───
    WeeklyVacancyItem:
      type: object
      required: [id, title, status, createdAt, clientId, clientName]
      properties:
        id:         { $ref: '#/components/schemas/UUID' }
        title:      { type: string }
        status:     { $ref: '#/components/schemas/VacancyStatus' }
        createdAt:  { type: string, format: date-time }
        clientId:   { $ref: '#/components/schemas/UUID' }
        clientName: { type: string }
    WeeklyVacancyBlock:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/WeeklyVacancyItem' } }
    WeeklySubmissionItem:
      type: object
      required: [matchId, status, addedAt, candidateId, candidateName, vacancyId, vacancyTitle, clientName]
      properties:
        matchId:       { $ref: '#/components/schemas/UUID' }
        status:        { $ref: '#/components/schemas/MatchStatus' }
        addedAt:       { type: string, format: date-time }
        candidateId:   { $ref: '#/components/schemas/UUID' }
        candidateName: { type: string }
        vacancyId:     { $ref: '#/components/schemas/UUID' }
        vacancyTitle:  { type: string }
        clientName:    { type: string }
        addedByName:   { type: string, nullable: true }
    WeeklySubmissionBlock:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/WeeklySubmissionItem' } }
    WeeklyInterviewItem:
      type: object
      required: [eventId, title, startsAt, status]
      properties:
        eventId:       { $ref: '#/components/schemas/UUID' }
        title:         { type: string }
        startsAt:      { type: string, format: date-time }
        status:        { $ref: '#/components/schemas/EventStatus' }
        candidateId:   { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        candidateName: { type: string, nullable: true }
        vacancyId:     { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        vacancyTitle:  { type: string, nullable: true }
    WeeklyInterviewBlock:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/WeeklyInterviewItem' } }
    WeeklyUserCount:
      type: object
      required: [count]
      properties:
        userId:   { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        fullName: { type: string, nullable: true }
        count:    { type: integer }
    WeeklyActivityResponse:
      type: object
      required: [period, newVacancies, submittedCandidates, interviews, interviewsHeld, byManagers, byRecruiters]
      properties:
        period:              { $ref: '#/components/schemas/PeriodWindow' }
        newVacancies:        { $ref: '#/components/schemas/WeeklyVacancyBlock' }
        submittedCandidates: { $ref: '#/components/schemas/WeeklySubmissionBlock' }
        # Собеседования окна по startsAt: назначены (scheduled/no_show) и проведены (held)
        interviews:          { $ref: '#/components/schemas/WeeklyInterviewBlock' }
        interviewsHeld:      { $ref: '#/components/schemas/WeeklyInterviewBlock' }
        # Разбивки: вакансии по аккаунт-менеджерам, подачи по added_by
        byManagers:          { type: array, items: { $ref: '#/components/schemas/WeeklyUserCount' } }
        byRecruiters:        { type: array, items: { $ref: '#/components/schemas/WeeklyUserCount' } }

    # ─── Worklog (учёт времени) ───
    WorkSessionEndReason:
      type: string
      enum: [disconnect, sweep, server_shutdown, reconcile]
    WorklogUserSummary:
      type: object
      required: [userId, fullName, totalSeconds, totalActiveSeconds, sessionsCount]
      properties:
        userId:             { $ref: '#/components/schemas/UUID' }
        fullName:           { type: string }
        totalSeconds:       { type: integer }
        # Активное время (вкладка в фокусе + взаимодействие), пропорц. окну.
        totalActiveSeconds: { type: integer }
        sessionsCount:      { type: integer }
    WorklogSummaryResponse:
      type: object
      required: [from, to, items]
      properties:
        from:  { type: string, format: date-time }
        to:    { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/WorklogUserSummary' } }
    WorklogSession:
      type: object
      required: [id, startedAt, lastHeartbeatAt]
      properties:
        id:              { $ref: '#/components/schemas/UUID' }
        userId:          { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        startedAt:       { type: string, format: date-time }
        lastHeartbeatAt: { type: string, format: date-time }
        endedAt:         { type: string, format: date-time, nullable: true }
        endReason:       { allOf: [{ $ref: '#/components/schemas/WorkSessionEndReason' }], nullable: true }
        durationSeconds: { type: integer, nullable: true }

    # ─── Files ───
    FileEntityType:
      type: string
      enum: [candidate, vacancy, client, contact, document]
    ScanStatus:
      type: string
      enum: [pending, clean, infected, error]
    FileResponse:
      type: object
      required: [id, entityType, entityId, fileKey, originalName, mime, size, scanStatus, createdAt]
      properties:
        id:           { $ref: '#/components/schemas/UUID' }
        # Может быть null: владелец удалён.
        ownerUserId:  { allOf: [{ $ref: '#/components/schemas/UUID' }], nullable: true }
        entityType:   { $ref: '#/components/schemas/FileEntityType' }
        entityId:     { $ref: '#/components/schemas/UUID' }
        fileKey:      { type: string }
        originalName: { type: string }
        mime:         { type: string }
        size:         { type: integer, format: int64 }
        scanStatus:   { $ref: '#/components/schemas/ScanStatus' }
        scannedAt:    { type: string, format: date-time, nullable: true }
        createdAt:    { type: string, format: date-time }
    PresignRequest:
      type: object
      required: [entityType, entityId, originalName, mime, size]
      properties:
        entityType:   { $ref: '#/components/schemas/FileEntityType' }
        entityId:     { $ref: '#/components/schemas/UUID' }
        originalName: { type: string, minLength: 1, maxLength: 512 }
        mime:         { type: string }
        size:         { type: integer, minimum: 1 }
    PresignResponse:
      type: object
      required: [url, fields, fileKey, maxBytes]
      properties:
        url:      { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        fileKey:  { type: string }
        maxBytes: { type: integer }
    ConfirmRequest:
      type: object
      required: [fileKey, entityType, entityId, originalName, mime, size]
      properties:
        fileKey:      { type: string }
        entityType:   { $ref: '#/components/schemas/FileEntityType' }
        entityId:     { $ref: '#/components/schemas/UUID' }
        originalName: { type: string }
        mime:         { type: string }
        size:         { type: integer, minimum: 1 }
    DownloadResponse:
      type: object
      required: [url, expiresIn]
      properties:
        url:       { type: string }
        expiresIn: { type: integer }

    # ─── Documents ───
    DocumentSectionId:
      type: string
      enum: [clients, regulations, company, employees, contractors, tender, general]
      description: |
        Логический раздел базы знаний:
        - clients: документы по клиентам (договоры, NDA, спецификации)
        - regulations: внутренние регламенты и SLA
        - company: устав, реквизиты, учредительные
        - employees: кадры
        - contractors: внешние исполнители
        - tender: тендерные заявки
        - general: общие материалы команды
    DocumentKind:
      type: string
      enum: [doc, pdf, xlsx, pptx, image, folder, note]
      description: |
        `note` — внутренняя заметка с HTML-телом (рендерится Tiptap). Тело хранится
        в `Document.body`, файл (`fileId`) для заметок не используется.
    Document:
      type: object
      required: [id, title, emoji, kind, section, ownerUserId, updatedAt, createdAt]
      properties:
        id:           { $ref: '#/components/schemas/UUID' }
        title:        { type: string, minLength: 1, maxLength: 512 }
        emoji:        { type: string, description: 'Эмодзи-иконка документа/папки' }
        kind:         { $ref: '#/components/schemas/DocumentKind' }
        section:      { $ref: '#/components/schemas/DocumentSectionId' }
        parentId:
          oneOf:
            - { $ref: '#/components/schemas/UUID' }
            - { type: 'null' }
          description: 'ID родительской папки. null/отсутствует = корень раздела.'
        description:  { type: string, nullable: true, maxLength: 4000 }
        tags:
          type: array
          items: { type: string, maxLength: 64 }
        ownerUserId:  { $ref: '#/components/schemas/UUID' }
        ownerName:    { type: string, description: 'Денормализованное ФИО владельца для списков' }
        fileId:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: 'Ссылка на загруженный файл из /files (если есть)'
        fileMeta:
          allOf:
            - $ref: '#/components/schemas/DocumentFileMeta'
          nullable: true
        body:
          type: string
          nullable: true
          description: 'HTML-контент для kind=note (вывод Tiptap)'
        versionsCount:  { type: integer, minimum: 0 }
        commentsCount:  { type: integer, minimum: 0 }
        isFavorite:     { type: boolean, description: 'Избранное для текущего пользователя' }
        createdAt:      { type: string, format: date-time }
        updatedAt:      { type: string, format: date-time }
    DocumentFileMeta:
      type: object
      required: [fileName, mime, size]
      description: |
        Облегчённые метаданные приложенного файла. Полную запись и presigned URL для
        скачивания берём через `/files/{id}/download`.
      properties:
        fileName: { type: string }
        mime:     { type: string }
        size:     { type: integer, format: int64 }
    CreateDocumentRequest:
      type: object
      required: [title, kind, section, emoji]
      properties:
        title:       { type: string, minLength: 1, maxLength: 512 }
        emoji:       { type: string }
        kind:        { $ref: '#/components/schemas/DocumentKind' }
        section:     { $ref: '#/components/schemas/DocumentSectionId' }
        parentId:    { $ref: '#/components/schemas/UUID', nullable: true }
        description: { type: string, maxLength: 4000 }
        tags:
          type: array
          items: { type: string, maxLength: 64 }
        ownerUserId: { $ref: '#/components/schemas/UUID', nullable: true, description: 'По умолчанию — текущий пользователь' }
        fileId:      { $ref: '#/components/schemas/UUID', nullable: true }
        body:        { type: string, nullable: true, description: 'HTML для kind=note' }
    UpdateDocumentRequest:
      type: object
      properties:
        title:       { type: string, minLength: 1, maxLength: 512 }
        emoji:       { type: string }
        description: { type: string, nullable: true, maxLength: 4000 }
        tags:
          type: array
          items: { type: string, maxLength: 64 }
        ownerUserId: { $ref: '#/components/schemas/UUID' }
        fileId:      { $ref: '#/components/schemas/UUID', nullable: true, description: 'Прикреплённый файл (из /files/confirm)' }
        body:        { type: string, nullable: true, description: 'HTML для kind=note' }
    MoveDocumentRequest:
      type: object
      required: [section]
      properties:
        section:  { $ref: '#/components/schemas/DocumentSectionId' }
        parentId: { $ref: '#/components/schemas/UUID', nullable: true }
    BulkMoveDocumentsRequest:
      type: object
      required: [ids, section]
      properties:
        ids:      { type: array, items: { $ref: '#/components/schemas/UUID' }, minItems: 1 }
        section:  { $ref: '#/components/schemas/DocumentSectionId' }
        parentId: { $ref: '#/components/schemas/UUID', nullable: true }
    DocumentVersion:
      type: object
      required: [id, documentId, label, authorUserId, createdAt]
      properties:
        id:           { $ref: '#/components/schemas/UUID' }
        documentId:   { $ref: '#/components/schemas/UUID' }
        label:        { type: string, minLength: 1, maxLength: 64 }
        note:         { type: string, nullable: true, maxLength: 1000 }
        authorUserId: { $ref: '#/components/schemas/UUID' }
        authorName:   { type: string }
        fileId:       { $ref: '#/components/schemas/UUID', nullable: true }
        createdAt:    { type: string, format: date-time }
    CreateDocumentVersionRequest:
      type: object
      required: [label]
      properties:
        label:  { type: string, minLength: 1, maxLength: 64 }
        note:   { type: string, maxLength: 1000 }
        fileId: { $ref: '#/components/schemas/UUID', nullable: true }
    DocumentComment:
      type: object
      required: [id, documentId, text, authorUserId, createdAt]
      properties:
        id:           { $ref: '#/components/schemas/UUID' }
        documentId:   { $ref: '#/components/schemas/UUID' }
        text:         { type: string, minLength: 1, maxLength: 4000 }
        authorUserId: { $ref: '#/components/schemas/UUID' }
        authorName:   { type: string }
        createdAt:    { type: string, format: date-time }
    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Document' } }

    # ─── Permissions Matrix ───
    MatrixPermission:
      type: object
      required: [id, group, permission, description, actions, matrix]
      properties:
        id:          { type: string }
        group:       { type: string }
        permission:  { type: string }
        description: { type: string }
        actions:
          type: array
          items: { type: string, description: 'Action key, см. lib/permissions-data.ts' }
        matrix:
          type: object
          description: 'Словарь { role: boolean } по всем ролям.'
          additionalProperties: { type: boolean }

    # ─── Pagination ───
    Page:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:    { type: array, items: {} }
        total:    { type: integer, minimum: 0 }
        page:     { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    ClientPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Client' } }
    ContactListItemPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ContactListItem' } }
    VacancyPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Vacancy' } }
    CandidatePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Candidate' } }

    EventType:
      type: string
      enum: [interview, meeting, reminder]
    EventLocationKind:
      type: string
      enum: [online, onsite, phone]
    EventStatus:
      type: string
      enum: [scheduled, held, no_show, canceled]
    AttendeeResponse:
      type: string
      enum: [invited, accepted, declined]
    EventAttendee:
      type: object
      required: [userId, response]
      properties:
        userId:   { $ref: '#/components/schemas/UUID' }
        response: { $ref: '#/components/schemas/AttendeeResponse' }
        name:     { type: string, nullable: true }
    CalendarEvent:
      type: object
      required: [id, type, title, startsAt, allDay, locationKind, status, createdAt, updatedAt, attendees]
      properties:
        id:            { $ref: '#/components/schemas/UUID' }
        type:          { $ref: '#/components/schemas/EventType' }
        title:         { type: string }
        startsAt:      { type: string, format: date-time }
        endsAt:        { type: string, format: date-time, nullable: true }
        allDay:        { type: boolean }
        locationKind:  { $ref: '#/components/schemas/EventLocationKind' }
        location:      { type: string, nullable: true }
        status:        { $ref: '#/components/schemas/EventStatus' }
        outcome:       { type: string, nullable: true }
        candidateId:   { $ref: '#/components/schemas/UUID', nullable: true }
        vacancyId:     { $ref: '#/components/schemas/UUID', nullable: true }
        matchId:       { $ref: '#/components/schemas/UUID', nullable: true }
        createdById:   { $ref: '#/components/schemas/UUID', nullable: true }
        createdAt:     { type: string, format: date-time }
        updatedAt:     { type: string, format: date-time }
        attendees:     { type: array, items: { $ref: '#/components/schemas/EventAttendee' } }
        candidateName: { type: string, nullable: true }
        vacancyTitle:  { type: string, nullable: true }
    CreateEventRequest:
      type: object
      required: [startsAt]
      properties:
        type:         { $ref: '#/components/schemas/EventType' }
        title:        { type: string, nullable: true }
        startsAt:     { type: string, format: date-time }
        endsAt:       { type: string, format: date-time, nullable: true }
        allDay:       { type: boolean, default: false }
        locationKind: { $ref: '#/components/schemas/EventLocationKind' }
        location:     { type: string, nullable: true }
        candidateId:  { $ref: '#/components/schemas/UUID', nullable: true }
        vacancyId:    { $ref: '#/components/schemas/UUID', nullable: true }
        matchId:      { $ref: '#/components/schemas/UUID', nullable: true }
        attendeeIds:  { type: array, items: { $ref: '#/components/schemas/UUID' } }
    UpdateEventRequest:
      type: object
      properties:
        title:        { type: string, nullable: true }
        startsAt:     { type: string, format: date-time, nullable: true }
        endsAt:       { type: string, format: date-time, nullable: true }
        allDay:       { type: boolean, nullable: true }
        locationKind: { $ref: '#/components/schemas/EventLocationKind' }
        location:     { type: string, nullable: true }
        attendeeIds:  { type: array, items: { $ref: '#/components/schemas/UUID' }, nullable: true }
    OutcomeRequest:
      type: object
      required: [status]
      properties:
        status:          { type: string, enum: [held, no_show] }
        outcome:         { type: string, nullable: true }
        nextMatchStatus: { $ref: '#/components/schemas/MatchStatus' }
    # ─────────────── SCREENINGS ───────────────
    ScreeningStatus:
      type: string
      enum: [draft, live, processing, done, error]
    ScreeningSpeaker:
      type: string
      enum: [recruiter, candidate]
    ScreeningQuestionSource:
      type: string
      enum: [pregenerated, followup, manual]
    ScreeningQuestionStatus:
      type: string
      enum: [pending, asked, answered, skipped]
    ScreeningVerdict:
      type: string
      enum: [fit, partial_fit, no_fit]
    ScreeningQuestion:
      type: object
      required: [id, position, text, source, status]
      properties:
        id:            { $ref: '#/components/schemas/UUID' }
        position:      { type: integer }
        text:          { type: string }
        goal:          { type: string, nullable: true }
        source:        { $ref: '#/components/schemas/ScreeningQuestionSource' }
        status:        { $ref: '#/components/schemas/ScreeningQuestionStatus' }
        answerSummary: { type: string, nullable: true }
    ScreeningReport:
      type: object
      required: [id, summary, verdict, createdAt]
      properties:
        id:             { $ref: '#/components/schemas/UUID' }
        summary:        { type: string }
        verdict:        { $ref: '#/components/schemas/ScreeningVerdict' }
        scores:         { type: object, additionalProperties: true, nullable: true }
        redFlags:       { type: array, items: { type: string }, nullable: true }
        recommendation: { type: string, nullable: true }
        model:          { type: string, nullable: true }
        createdAt:      { type: string, format: date-time }
    ScreeningSession:
      type: object
      required: [id, candidateId, status, consentConfirmed, createdAt, updatedAt, questions]
      properties:
        id:               { $ref: '#/components/schemas/UUID' }
        candidateId:      { $ref: '#/components/schemas/UUID' }
        vacancyId:        { $ref: '#/components/schemas/UUID', nullable: true }
        matchId:          { $ref: '#/components/schemas/UUID', nullable: true }
        recruiterId:      { $ref: '#/components/schemas/UUID', nullable: true }
        status:           { $ref: '#/components/schemas/ScreeningStatus' }
        telemostUrl:      { type: string, nullable: true }
        consentConfirmed: { type: boolean }
        startedAt:        { type: string, format: date-time, nullable: true }
        endedAt:          { type: string, format: date-time, nullable: true }
        durationSec:      { type: integer, nullable: true }
        audioFileId:      { $ref: '#/components/schemas/UUID', nullable: true }
        createdAt:        { type: string, format: date-time }
        updatedAt:        { type: string, format: date-time }
        questions:
          type: array
          items: { $ref: '#/components/schemas/ScreeningQuestion' }
        candidateName: { type: string, nullable: true }
        vacancyTitle:  { type: string, nullable: true }
        recruiterName: { type: string, nullable: true }
        report:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ScreeningReport' }]
    ScreeningListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ScreeningSession' }
        total:    { type: integer }
        page:     { type: integer }
        pageSize: { type: integer }
    CreateScreeningRequest:
      type: object
      required: [candidateId]
      properties:
        candidateId: { $ref: '#/components/schemas/UUID' }
        vacancyId:   { $ref: '#/components/schemas/UUID', nullable: true }
        matchId:     { $ref: '#/components/schemas/UUID', nullable: true }
        telemostUrl: { type: string, nullable: true }
        questions:
          type: array
          items: { type: string }
          default: []
    UpdateScreeningRequest:
      type: object
      properties:
        telemostUrl:      { type: string, nullable: true }
        consentConfirmed: { type: boolean, nullable: true }
