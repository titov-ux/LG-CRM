[project]
name = "crm-lg-backend"
version = "0.1.0"
description = "CRM ЛГ Интеграция — backend (FastAPI + SQLAlchemy + Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "boto3>=1.35",
    "bcrypt>=4.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "structlog>=24.4",
    "playwright>=1.54",
]

[project.optional-dependencies]
prod = [
    "sentry-sdk[fastapi]>=2.18",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "schemathesis>=3.39",
    # `[lua]` подтягивает lupa — нужно, чтобы fakeredis выполнял Lua-скрипты
    # из app/realtime/presence.py (EVAL/EVALSHA в тестах presence-стора).
    "fakeredis[lua]>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
