# Пример конфигурации nginx для production.
# Скопируйте этот файл в `infra/nginx.conf` и подставьте реальный server_name
# и пути к сертификатам.

# HTTP → HTTPS редирект.
server {
    listen 80;
    server_name staging.lachevsky.ru;
    location /.well-known/acme-challenge/ {
        # Должен совпадать с WEBROOT из infra/scripts/renew-cert.sh.
        # Этот путь монтируется как volume `../certbot-webroot:/var/www/certbot:ro`
        # в docker-compose.prod.yml.
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server.
server {
    listen 443 ssl http2;
    server_name staging.lachevsky.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 26m;  # чуть больше 25 МБ из ТЗ — на multipart overhead

    # WebSocket realtime-канал (/api/v1/ws/events) — нужны Upgrade-заголовки
    # и большой read-timeout, иначе nginx будет ронять висящее соединение.
    # Эта секция должна идти ПЕРЕД более общим `location /api/`, иначе nginx
    # подберёт общий блок и Upgrade-заголовки не дойдут до бэкенда.
    location /api/v1/ws/ {
        proxy_pass http://backend:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API → backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Healthcheck (бэк)
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    # SPA — раздаём билд React-приложения; неизвестные пути → index.html (HTML5 routing).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # хешированные ассеты vite — иммутабельные, можно агрессивно кешировать.
        location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
