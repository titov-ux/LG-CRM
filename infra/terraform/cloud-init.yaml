#cloud-config
# cloud-init для VM в Yandex Cloud. Запускается один раз при первом старте VM.
# Ставит Docker, awscli, git; создаёт пользователя `crm` с sudo и кладёт ключ;
# подкладывает помощник `crm-lg-bootstrap.sh`, который пользователь запускает руками.

users:
  - name: crm
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [docker]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - unzip
  - jq
  - awscli
  - cron
  - logrotate

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {"max-size": "20m", "max-file": "5"}
      }
  - path: /etc/profile.d/crm-lg.sh
    content: |
      # Алиасы для удобства
      alias dc='docker compose -f /opt/crm-lg/infra/docker-compose.prod.yml --env-file /opt/crm-lg/.env.prod'
      alias crm-logs='dc logs -f --tail=200'
      alias crm-shell='dc exec backend bash'
    permissions: '0644'
  - path: /usr/local/bin/crm-lg-bootstrap.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Тонкая обёртка над scripts/bootstrap.sh — клонирует репо, если его ещё нет.
      set -euo pipefail
      REPO="$${CRM_LG_REPO:-https://github.com/lg-integration/crm-lg.git}"
      DEST="$${CRM_LG_DIR:-/opt/crm-lg}"

      if [ ! -d "$DEST" ]; then
        sudo mkdir -p "$DEST"
        sudo chown -R crm:crm "$DEST"
        git clone "$REPO" "$DEST"
      else
        echo "[bootstrap] $DEST уже существует — пропускаю clone"
      fi
      cd "$DEST"
      exec bash scripts/bootstrap.sh "$@"

runcmd:
  # Docker engine + compose plugin
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker crm
  # Certbot из snap — рекомендованный способ EFF.
  - DEBIAN_FRONTEND=noninteractive apt-get install -y snapd
  - snap install --classic certbot
  - ln -sf /snap/bin/certbot /usr/local/bin/certbot
  # Подготовим директорию для проекта
  - mkdir -p /opt/crm-lg
  - chown -R crm:crm /opt/crm-lg

final_message: |
  Готово. Зайдите по SSH и запустите:
    sudo /usr/local/bin/crm-lg-bootstrap.sh
