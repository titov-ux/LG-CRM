# Пример конфигурации nginx для production.
# Скопируйте этот файл в `infra/nginx.conf` и подставьте реальный server_name
# и пути к сертификатам.

# HTTP → HTTPS редирект.
server {
    listen 80;
    server_name staging.lachevsky.ru;
    location /.well-known/acme-challenge/ {
        # Должен совпадать с WEBROOT из infra/scripts/renew-cert.sh.
        # Этот путь монтируется как volume `../certbot-webroot:/var/www/certbot:ro`
        # в docker-compose.prod.yml.
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server.
server {
    # `listen 443 ssl http2;` — deprecated с nginx 1.25 (в логе «the `listen ...
    # http2` directive is deprecated»). Правильная форма — отдельная директива
    # http2. В образе nginx:1.27-alpine (см. docker-compose.prod.yml) она есть.
    listen 443 ssl;
    http2 on;
    server_name staging.lachevsky.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 26m;  # чуть больше 25 МБ из ТЗ — на multipart overhead

    # WebSocket realtime (/api/v1/ws/events и /api/v1/ws/screening/{id}) —
    # нужны Upgrade-заголовки и большой read-timeout, иначе nginx будет
    # ронять висящее соединение (скрининг может длиться до ~90 мин).
    #
    # Отдельная локация именно под скрининг (/api/v1/ws/screening/) не нужна:
    # этот блок уже покрывает обе ручки одинаковыми настройками. Порядок
    # location в файле при этом НЕ важен — nginx выбирает самый длинный
    # совпавший префикс, поэтому `/api/v1/ws/` всегда выигрывает у `/api/`,
    # где бы блоки ни стояли (раньше здесь было обратное утверждение).
    #
    # Таймауты. Hard-stop live-сессии задаётся бэкендом:
    # SCREENING_MAX_DURATION_MIN=90 → 5400 с, и всё это время соединение
    # обязано жить. 3600 с здесь были МЕНЬШЕ лимита сессии — на длинной
    # встрече nginx рвал бы WS раньше сервера (для клиента это выглядит как
    # случайный обрыв на 60-й минуте). Ставим 7200 с = 2 ч: с запасом больше
    # 90 мин, чтобы менять SCREENING_MAX_DURATION_MIN в пределах разумного
    # можно было без правки nginx. На практике до таймаута обычно не доходит —
    # сервер шлёт ping каждые 30 с, и каждый фрейм сбрасывает счётчик, — но
    # потолок всё равно должен быть выше лимита сессии, а не ниже.
    #
    # Размер WS-фрейма nginx НЕ ограничивает: client_max_body_size относится к
    # HTTP-телу запроса, а не к фреймам после Upgrade. Единственный реальный
    # лимит — флаг uvicorn `--ws-max-size 4194304` (4 МБ) в команде сервиса
    # backend в infra/docker-compose.prod.yml; симметрично на плече
    # backend → stt-service стоит websockets max_size=2**22
    # (backend/app/modules/screening/stt_bridge.py). Аудио-фреймы скрининга —
    # ~3.2 КБ (1 байт канала + 100 мс PCM16LE 16 кГц), запас огромный.
    location /api/v1/ws/ {
        proxy_pass http://backend:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    # API → backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Healthcheck (бэк)
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    # SPA — раздаём билд React-приложения; неизвестные пути → index.html (HTML5 routing).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html НЕ кешируем: iOS Safari жадно кеширует HTML без явного
        # заголовка, и после деплоя телефон остаётся на старом бандле
        # (ссылки на удалённые хешированные чанки → вечная «загрузка»).
        add_header Cache-Control "no-cache" always;
        # хешированные ассеты vite — иммутабельные, можно агрессивно кешировать.
        location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
