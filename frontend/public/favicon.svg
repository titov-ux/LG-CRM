<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ЛГ Интеграция">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .fg { fill: #f8fafc; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #f8fafc; }
        .fg { fill: #0f172a; }
      }
      text.mono {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -1.2px;
      }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="64" height="64" rx="14" ry="14"/>
  <text class="mono fg" x="32" y="44" text-anchor="middle">ЛГ</text>
</svg>
